name: Apply IBM Plex Sans Gothic Font

on:
  push:
    paths:
      - '.github/workflows/one-time-gothic-font.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Zen Kaku Gothic New Latin font handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          css_dir = root / 'assets' / 'css'

          # Do not alter the dedicated font comparison page.
          excluded = {'font-comparison.css'}

          def lighter(value: int) -> int:
              return max(100, value - 50)

          def transform_block(block: str) -> str:
              if 'Zen Kaku Gothic New' not in block:
                  return block

              block = block.replace(
                  '"Zen Kaku Gothic New", sans-serif',
                  '"IBM Plex Sans", "Zen Kaku Gothic New", sans-serif'
              )

              # Lower explicit numeric font-weight values by 50. The Zen Kaku
              # fallback retains its original available face through normal
              # CSS font matching, while IBM Plex Sans gets the lighter weight.
              block = re.sub(
                  r'(font-weight\s*:\s*)([1-9]\d{2})(?=\s*;)',
                  lambda m: m.group(1) + str(lighter(int(m.group(2)))),
                  block,
              )

              # Handle font shorthand declarations such as font:500 14px/1.5 ...
              block = re.sub(
                  r'(font\s*:\s*)([1-9]\d{2})(?=\s+[^;]*?"IBM Plex Sans")',
                  lambda m: m.group(1) + str(lighter(int(m.group(2)))),
                  block,
              )
              return block

          for path in sorted(css_dir.glob('*.css')):
              if path.name in excluded:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'Zen Kaku Gothic New' not in text:
                  continue

              # Transform each CSS declaration block independently.
              out = []
              pos = 0
              while True:
                  start = text.find('{', pos)
                  if start < 0:
                      out.append(text[pos:])
                      break
                  out.append(text[pos:start + 1])
                  depth = 1
                  i = start + 1
                  while i < len(text) and depth:
                      if text[i] == '{':
                          depth += 1
                      elif text[i] == '}':
                          depth -= 1
                      i += 1
                  inner = text[start + 1:i - 1]
                  out.append(transform_block(inner))
                  if i <= start + 1:
                      break
                  out.append('}' if depth == 0 else '')
                  pos = i
              new_text = ''.join(out)
              path.write_text(new_text, encoding='utf-8')

          style = css_dir / 'style.css'
          style_text = style.read_text(encoding='utf-8')
          first_import = "@import url('https://fonts.googleapis.com/css2?"
          ibm_url = "&family=IBM+Plex+Sans:wght@100..700"
          if 'family=IBM+Plex+Sans' not in style_text:
              line_end = style_text.find('\n')
              first = style_text[:line_end]
              rest = style_text[line_end:]
              first = first.replace('&family=Zen+Kaku+Gothic+New:wght@400;500;700', '&family=Zen+Kaku+Gothic+New:wght@400;500;600;700' + ibm_url)
              style_text = first + rest
              style.write_text(style_text, encoding='utf-8')

          # The temporary standalone override is no longer needed.
          temporary = css_dir / 'latin-sans.css'
          if temporary.exists():
              temporary.unlink()
          PY

      - name: Commit font change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css .github/workflows/one-time-gothic-font.yml
          git add -u assets/css/latin-sans.css
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Use IBM Plex Sans for Latin glyphs"
          git push
