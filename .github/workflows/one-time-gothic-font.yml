name: Apply IBM Plex Sans Gothic Font

on:
  push:
    paths:
      - '.github/workflows/one-time-gothic-font.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Zen Kaku Gothic New Latin font handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_dir = Path('assets/css')
          excluded = {'font-comparison.css'}
          family_pattern = re.compile(r'"Zen Kaku Gothic New"\s*,\s*sans-serif')
          weight_pattern = re.compile(r'(font-weight\s*:\s*)([1-9]\d{2})(?=\s*;)')
          shorthand_pattern = re.compile(r'(font\s*:\s*)([1-9]\d{2})(?=\s+[^;]*?"IBM Plex Sans")')

          def lighter(value: int) -> int:
              return max(100, value - 50)

          def transform_declarations(declarations: str) -> str:
              if 'Zen Kaku Gothic New' not in declarations:
                  return declarations
              declarations = family_pattern.sub(
                  '"IBM Plex Sans", "Zen Kaku Gothic New", sans-serif',
                  declarations,
              )
              declarations = weight_pattern.sub(
                  lambda m: m.group(1) + str(lighter(int(m.group(2)))),
                  declarations,
              )
              declarations = shorthand_pattern.sub(
                  lambda m: m.group(1) + str(lighter(int(m.group(2)))),
                  declarations,
              )
              return declarations

          def transform_segment(text: str) -> str:
              out = []
              pos = 0
              while True:
                  start = text.find('{', pos)
                  if start < 0:
                      out.append(text[pos:])
                      break
                  out.append(text[pos:start + 1])
                  depth = 1
                  i = start + 1
                  while i < len(text) and depth:
                      if text[i] == '{':
                          depth += 1
                      elif text[i] == '}':
                          depth -= 1
                      i += 1
                  inner = text[start + 1:i - 1]
                  if '{' in inner:
                      inner = transform_segment(inner)
                  else:
                      inner = transform_declarations(inner)
                  out.append(inner)
                  out.append('}' if depth == 0 else '')
                  pos = i
              return ''.join(out)

          for path in sorted(css_dir.glob('*.css')):
              if path.name in excluded:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'Zen Kaku Gothic New' not in text:
                  continue
              path.write_text(transform_segment(text), encoding='utf-8')

          style = css_dir / 'style.css'
          style_text = style.read_text(encoding='utf-8')
          if 'family=IBM+Plex+Sans' not in style_text:
              line_end = style_text.find('\n')
              first = style_text[:line_end]
              rest = style_text[line_end:]
              first = first.replace(
                  '&family=Zen+Kaku+Gothic+New:wght@400;500;700',
                  '&family=Zen+Kaku+Gothic+New:wght@400;500;600;700&family=IBM+Plex+Sans:wght@100..700'
              )
              style.write_text(first + rest, encoding='utf-8')

          temporary = css_dir / 'latin-sans.css'
          if temporary.exists():
              temporary.unlink()
          PY

      - name: Commit font change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css .github/workflows/one-time-gothic-font.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Apply IBM Plex Sans Latin font stack"
          git push
