name: Build and Deploy GitHub Pages

on:
  push:
    branches: [main, font-fallback-fix]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: python -m pip install PyYAML
      - name: Regenerate CSV-driven pages
        run: python scripts/build_site.py
      - name: Build Glossary list
        run: python scripts/build_glossary.py
      - name: Validate font fallback boundaries
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'latin-sans\.css|font-weight-adjust\.css|detail-fonts\.css' assets/css templates scripts _site --exclude='font-comparison.css'; then
            echo 'Obsolete font CSS reference detected.'
            exit 1
          fi
          if grep -R -n 'Source Serif 4",[[:space:]]*serif' assets/css --include='*.css' --exclude='font-comparison.css'; then
            echo 'Source Serif 4 declaration without Shippori Mincho fallback detected.'
            exit 1
          fi
          if grep -R -n 'IBM Plex Sans",[[:space:]]*"IBM Plex Sans"' assets/css --include='*.css'; then
            echo 'Duplicate IBM Plex Sans stack detected.'
            exit 1
          fi
          test ! -e assets/css/font-weight-adjust.css
          test ! -e assets/css/detail-fonts.css
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
