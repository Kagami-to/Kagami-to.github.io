name: Format style.css safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-style-css.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format CSS while preserving strings and comments
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/css/style.css')
          src = p.read_text(encoding='utf-8')
          out = []
          buf = []
          quote = None
          comment = False
          escape = False
          indent = 0

          def emit(text):
              text = text.strip()
              if text:
                  out.append('  ' * indent + text)

          i = 0
          while i < len(src):
              ch = src[i]
              nxt = src[i + 1] if i + 1 < len(src) else ''

              if comment:
                  buf.append(ch)
                  if ch == '*' and nxt == '/':
                      buf.append(nxt)
                      i += 2
                      comment = False
                      emit(''.join(buf))
                      buf = []
                      out.append('')
                      continue
                  i += 1
                  continue

              if quote:
                  buf.append(ch)
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == quote:
                      quote = None
                  i += 1
                  continue

              if ch == '/' and nxt == '*':
                  if buf:
                      buf.append(ch)
                  else:
                      buf.append(ch)
                  buf.append(nxt)
                  i += 2
                  comment = True
                  continue

              if ch in "'\"":
                  quote = ch
                  buf.append(ch)
                  i += 1
                  continue

              if ch == '{':
                  buf.append(' {')
                  emit(''.join(buf))
                  buf = []
                  indent += 1
              elif ch == '}':
                  if buf:
                      emit(''.join(buf))
                      buf = []
                  indent = max(0, indent - 1)
                  emit('}')
                  out.append('')
              elif ch == ';':
                  buf.append(';')
                  emit(''.join(buf))
                  buf = []
              else:
                  buf.append(ch)
              i += 1

          if buf:
              emit(''.join(buf))

          while out and out[-1] == '':
              out.pop()
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css
          git commit -m 'Format style.css for readability'
          git push
