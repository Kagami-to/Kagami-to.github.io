name: Apply compact card styling
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact shared link cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/css/style.css')
          s = p.read_text()
          old = '.card { display: block; padding: 1.25rem; background: #fff; border: 1px solid #ddd; border-radius: 0; text-decoration: none; }'
          new = '.card { display: block; padding: .75rem 1rem; background: #fff; border: 1px solid #ddd; border-radius: 0; text-decoration: none; }'
          if old not in s:
              raise SystemExit('Expected .card rule not found; refusing to modify CSS.')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css
          git rm .github/workflows/apply-card-compact.yml
          git commit -m 'Compact shared link cards'
          git push
