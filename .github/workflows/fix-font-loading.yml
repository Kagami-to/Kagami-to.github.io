name: Centralize font loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-font-loading.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Google Fonts import into style.css and remove duplicates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          style = Path('assets/css/style.css')
          s = style.read_text(encoding='utf-8')
          pattern = re.compile(r"@import\s+url\('https://fonts\.googleapis\.com/[^']+'\);", re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('Google Fonts import not found in style.css')
          imp = m.group(0)
          s = s[:m.start()] + s[m.end():]
          s = imp + '\n\n' + s.lstrip()
          style.write_text(s, encoding='utf-8')

          cards = Path('assets/css/entity-cards.css')
          c = cards.read_text(encoding='utf-8')
          c, n = pattern.subn('', c, count=1)
          if n != 1:
              raise SystemExit('Expected exactly one Google Fonts import in entity-cards.css')
          cards.write_text(c.lstrip(), encoding='utf-8')

          for path, href in [
              ('index.html', 'assets/css/entity-cards.css'),
              ('404.html', '/assets/css/entity-cards.css'),
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              link = f'<link rel="stylesheet" href="{href}">'
              if link not in text:
                  raise SystemExit(f'Expected duplicate font-loading stylesheet link in {path}')
              text = text.replace(link, '', 1)
              p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css assets/css/entity-cards.css index.html 404.html
          git commit -m 'Centralize font loading in style.css'
          git push
