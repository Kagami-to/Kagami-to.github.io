name: Vectorize Kagamito Logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vectorize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install vectorization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick potrace

      - name: Prepare logo bitmap
        run: |
          mkdir -p work assets/images
          magick 1619993185.png -alpha extract -threshold 50% work/logo.pbm

      - name: Convert bitmap to SVG
        run: |
          potrace work/logo.pbm --svg --output assets/images/kagamito-logo.svg

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/kagamito-logo.svg
          git diff --cached --quiet && exit 0
          git commit -m "Add vectorized Kagamito logo"
          git push