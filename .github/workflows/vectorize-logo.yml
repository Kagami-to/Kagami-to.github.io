name: Vectorize Kagamito Logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vectorize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install vectorization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y potrace
          python -m pip install --upgrade pillow

      - name: Extract logo from background
        run: |
          mkdir -p work assets/images
          python - <<'PY'
          from PIL import Image

          src = Image.open('1619993185.png').convert('RGBA')
          w, h = src.size
          p = src.load()
          out = Image.new('1', (w, h), 0)
          q = out.load()

          # Estimate the background from the four corners. Pixels close to
          # that background are discarded. Near-white pixels that are both
          # opaque and sufficiently different from the background are kept.
          samples = [p[0,0], p[w-1,0], p[0,h-1], p[w-1,h-1]]
          bg = tuple(sum(s[i] for s in samples) // 4 for i in range(3))
          tolerance = 13

          for y in range(h):
              for x in range(w):
                  r, g, b, a = p[x,y]
                  if a < 242:
                      continue
                  if r < 230 or g < 230 or b < 230:
                      continue
                  if max(abs(r-bg[0]), abs(g-bg[1]), abs(b-bg[2])) <= tolerance:
                      continue
                  q[x,y] = 1

          out.save('work/logo.pbm')
          print('Background reference:', bg)
          print('Saved extracted bitmap:', w, 'x', h)
          PY

      - name: Convert bitmap to SVG
        run: |
          potrace work/logo.pbm --svg --output assets/images/kagamito-logo.svg
          test -s assets/images/kagamito-logo.svg

      - name: Normalize SVG fill
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/images/kagamito-logo.svg')
          s = p.read_text()
          s = s.replace('fill="black"', 'fill="#FFFFFF"')
          p.write_text(s)
          PY

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/kagamito-logo.svg
          if git diff --cached --quiet; then
            echo "SVG is already up to date"
            exit 0
          fi
          git commit -m "Improve Kagamito logo vectorization"
          git push