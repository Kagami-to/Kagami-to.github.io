name: Vectorize Kagamito Logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vectorize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install vectorization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y potrace
          python -m pip install --upgrade pillow

      - name: Prepare logo bitmap with Pillow
        run: |
          mkdir -p work assets/images
          python - <<'PY'
          from PIL import Image

          src = Image.open('1619993185.png').convert('RGBA')
          px = src.load()
          w, h = src.size

          # The original logo is intended to be white on transparent.
          # Allow about 5% tolerance in each RGB channel so near-white
          # anti-aliased pixels are retained, while rejecting faint colored
          # background pixels and transparency artifacts.
          out = Image.new('1', (w, h), 0)
          dst = out.load()
          for y in range(h):
              for x in range(w):
                  r, g, b, a = px[x, y]
                  near_white = r >= 242 and g >= 242 and b >= 242
                  sufficiently_opaque = a >= 242
                  dst[x, y] = 1 if near_white and sufficiently_opaque else 0

          out.save('work/logo.pbm')
          print(f'Prepared {w}x{h} bitmap using near-white + opacity threshold')
          PY

      - name: Convert bitmap to SVG
        run: |
          potrace work/logo.pbm --svg --output assets/images/kagamito-logo.svg
          test -s assets/images/kagamito-logo.svg
          head -n 5 assets/images/kagamito-logo.svg

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/kagamito-logo.svg
          if git diff --cached --quiet; then
            echo "SVG is already up to date"
            exit 0
          fi
          git commit -m "Refine vectorized Kagamito logo"
          git push