name: Apply Shippori Mincho Latin Extended-A supplement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-font.css.yml'

permissions:
  contents: write

jobs:
  apply-font-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Latin Extended-A font faces
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Shippori Mincho Latin Extended-A supplement */'
          if marker in s:
              raise SystemExit('supplement already present')
          block = '''/* Shippori Mincho Latin Extended-A supplement */
          @font-face { font-family: 'Shippori Mincho'; font-style: normal; font-display: swap; font-weight: 400; src: url('/assets/shippori-mincho_5.3.0_latin-ext-400-normal.woff2') format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
          @font-face { font-family: 'Shippori Mincho'; font-style: normal; font-display: swap; font-weight: 500; src: url('/assets/shippori-mincho_5.3.0_latin-ext-500-normal.woff2') format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
          @font-face { font-family: 'Shippori Mincho'; font-style: normal; font-display: swap; font-weight: 600; src: url('/assets/shippori-mincho_5.3.0_latin-ext-600-normal.woff2') format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
          @font-face { font-family: 'Shippori Mincho'; font-style: normal; font-display: swap; font-weight: 700; src: url('/assets/shippori-mincho_5.3.0_latin-ext-700-normal.woff2') format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

          '''
          p.write_text(block + s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css
          git commit -m 'Add Shippori Mincho Latin Extended-A supplement'
          git push
