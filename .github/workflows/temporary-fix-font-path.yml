name: Temporary fix font paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-fix-font-path.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix local latin-ext font paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/style.css')
          s = p.read_text(encoding='utf-8')
          old = "url('/assets/shippori-mincho_5.3.0_latin-ext-"
          new = "url('../shippori-mincho_5.3.0_latin-ext-"
          count = s.count(old)
          if count != 4:
              raise SystemExit(f'Expected 4 font paths, found {count}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css
          git commit -m 'Fix latin-ext font asset paths'
          git push
