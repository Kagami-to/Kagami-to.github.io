name: Validate font fallback normalization

on:
  push:
    branches: [font-fallback-fix]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependency
        run: python -m pip install PyYAML

      - name: Generate site
        run: |
          python scripts/build_site.py
          python scripts/build_glossary.py

      - name: Validate font source boundaries
        shell: bash
        run: |
          set -euo pipefail

          # No production CSS may reference removed auxiliary font override files.
          if grep -R -nE 'latin-sans\.css|font-weight-adjust\.css|detail-fonts\.css' assets/css templates scripts _site --exclude='font-comparison.css' ; then
            echo 'Obsolete font CSS reference detected.'
            exit 1
          fi

          # All production Source Serif declarations must carry the Japanese fallback.
          if grep -R -n 'Source Serif 4",[[:space:]]*serif' assets/css --include='*.css' --exclude='font-comparison.css'; then
            echo 'Source Serif 4 declaration without Shippori Mincho fallback detected.'
            exit 1
          fi

          # No duplicate IBM Plex Sans fallback entry should remain.
          if grep -R -n 'IBM Plex Sans",[[:space:]]*"IBM Plex Sans"' assets/css --include='*.css'; then
            echo 'Duplicate IBM Plex Sans stack detected.'
            exit 1
          fi

          # The main stylesheet must own the common 50-point weight calibration.
          grep -nF '.site-title' assets/css/style.css
          grep -nF 'font-weight: 550' assets/css/style.css
          grep -nF 'font-weight: 700' assets/css/style.css

          # The removed helper files must actually be absent.
          test ! -e assets/css/font-weight-adjust.css
          test ! -e assets/css/detail-fonts.css

          echo 'Font fallback validation passed.'
