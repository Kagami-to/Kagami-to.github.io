name: Compact link cards
on:
  push:
    branches: [agent/compact-link-cards]
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p = Path('assets/css/style.css')
          s = p.read_text()
          old = '.card { display: block; padding: 1.25rem; background: #fff; border: 1px solid #ddd; border-radius: 0; text-decoration: none; }'
          new = '.card { display: block; padding: .75rem 1rem; background: #fff; border: 1px solid #ddd; border-radius: 0; text-decoration: none; }'
          if old not in s: raise SystemExit('Expected .card rule not found')
          p.write_text(s.replace(old, new, 1))
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/compact-cards.yml
          git add assets/css/style.css
          git commit -m 'Compact shared link cards'
          git push
