name: Inspect latin-ext font files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-latin-ext.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Inspect font metadata and cmap
        run: |
          python -m pip install fonttools brotli
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path

          for path in sorted(Path('assets').glob('shippori-mincho_5.3.0_latin-ext-*-normal.woff2')):
              font = TTFont(path)
              cmap = {}
              for table in font['cmap'].tables:
                  cmap.update(table.cmap)
              codepoints = sorted(cmap)
              names = {}
              for rec in font['name'].names:
                  if rec.nameID in (1, 2):
                      names.setdefault(rec.nameID, rec.toUnicode())
              print(f'FILE={path.name}')
              print(f'GLYPHS={len(font.getGlyphOrder())}')
              print(f'FAMILY={names.get(1)}')
              print(f'SUBFAMILY={names.get(2)}')
              print('CODEPOINTS=' + ' '.join(f'U+{cp:04X}' for cp in codepoints))
          PY
