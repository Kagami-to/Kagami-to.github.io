name: Cleanup legacy site structure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove legacy site structure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove legacy directories and files
        run: |
          rm -rf characters works songs preview kagamito
          rm -f 1000019937.svg
          rm -f .github/workflows/cleanup-legacy.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove legacy site structure"
          git push
