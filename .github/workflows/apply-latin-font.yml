name: Apply Latin font change

on:
  push:
    paths:
      - '.github/workflows/apply-latin-font.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update typography CSS
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/css/style.css')
          s = p.read_text(encoding='utf-8')

          marker_start = '/* Shippori Mincho Latin Extended-A supplement */'
          marker_end = '/* Kagamito Official — unified stylesheet */'
          start = s.find(marker_start)
          end = s.find(marker_end)
          if start == -1 or end == -1 or end < start:
              raise SystemExit('Expected font supplement block not found')
          s = s[:start] + marker_end + s[end + len(marker_end):]

          s = s.replace(
              "@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');",
              "@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,300..900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');"
          )

          s = s.replace('font-family: "Shippori Mincho", serif;', 'font-family: "Source Serif 4", "Shippori Mincho", serif;')
          s = s.replace('font: 600 38px/1.3 "Shippori Mincho", serif;', 'font: 600 38px/1.3 "Source Serif 4", "Shippori Mincho", serif;')
          p.write_text(s, encoding='utf-8')

          # Remove the obsolete self-hosted Shippori latin-ext files.
          for path in Path('assets').glob('shippori-mincho_5.3.0_latin-ext-*-normal.woff2'):
              path.unlink()
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css assets/shippori-mincho_5.3.0_latin-ext-*.woff2
          git commit -m 'feat: use Source Serif 4 for Latin text' || exit 0
          git push
