name: Apply Latin font

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'style: use Source Serif 4 for Latin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update shared Latin font
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/css/style.css')
          text = path.read_text(encoding='utf-8')

          # Add Source Serif 4 as the shared Latin face while retaining
          # Shippori Mincho as the Japanese fallback.
          text = re.sub(
              r"^@import url\('[^']+'\);",
              "@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,200..900&family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');",
              text,
              count=1,
              flags=re.MULTILINE,
          )

          # The attempted Shippori Latin Extended-A supplement is no longer
          # needed; Source Serif 4 is now responsible for Latin characters.
          text = re.sub(
              r"/\* Shippori Mincho Latin Extended-A supplement \*/.*?(?=/\* Kagamito Official — unified stylesheet \*/)",
              "",
              text,
              count=1,
              flags=re.DOTALL,
          )

          # Preserve intentional Zen Kaku Gothic UI roles. Everywhere that
          # previously explicitly selected Shippori Mincho gets Source Serif 4
          # first, so Latin uses the new face while Japanese falls back to
          # Shippori Mincho naturally.
          text = text.replace(
              '"Shippori Mincho", serif',
              '"Source Serif 4", "Shippori Mincho", serif',
          )

          text = re.sub(
              r"html \{\n  font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n\}",
              'html {\n  font-family: "Source Serif 4", "Shippori Mincho", serif;\n}',
              text,
              count=1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css
          git diff --cached --quiet || git commit -m 'style: use Source Serif 4 for Latin'
          git push
