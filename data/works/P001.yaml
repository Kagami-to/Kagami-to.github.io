id: P001

routes:
  - id: yaya
    title_ja: 八耶編
    stages:
      - id: 0
        scenes:
          - content:
              - type: flavor
                text_ja: >-
                  修学旅行を楽しんでいたごく普通の女子中学生、双結八耶。大阪・京都の2泊3日、今日はその2日目であった。京都市内の班別自由行動の最中、伏見稲荷大社を訪れる際に、八耶はとりわけ仲の良い親友である上白川琴音とともに班からはぐれてしまった。更に琴音は何やらブツブツと呟きながら走っていってしまう。
