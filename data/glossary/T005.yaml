summary_ja: |
  鴨草京にある私設の図書館。

  地上部は一般的な図書館であり、地下には巨大な閉架が存在している。また一角には数室の居住スペースがあり、館長のアレン・ハーグリーヴズと、文筆家の上白川文音が住んでいる。

  隔世における上白川学園の対となり、この世界の存続に関わる使命を持つ組織。図書館として歴史書などを管理するのみならず、歴史書の編纂をも担っている。

  ちなみに、鴨草京に立地させてもらう代わりに、御虹重による統治を正当化する内容の歴史書を捏造している。
summary_en: |
  A private library in Kamokusa-kyō.

  The above-ground section is an ordinary library, while a vast closed-stack collection lies underground. A small residential area consisting of several rooms is also located within the building, where its director, Allen Hargreaves, and the writer Ayane Kamishirakawa reside.

  Its counterpart in the Kaku-se is Kamishirakawa Academy, and it is an organization entrusted with a mission concerning the survival of this world. In addition to preserving historical records and other materials as a library, it also compiles historical texts.

  Incidentally, in exchange for being allowed to establish itself in Kamokusa-kyō, it fabricates historical texts that serve to legitimize Mikō Kasane's rule.
