id: T001

sections:
  - title_ja: 概要
    title_en: Overview
    content_ja: |
      物語の大きな舞台となる異世界。日本神話における三種の神器が一つ、八咫鏡に映った向こう側として生まれた。反対にこちら側の世界のことを鏡外では隔世と呼ぶ。

      かつて神話の時代では単に隔世を鏡に写したものでしかないので、異世界と呼べるかどうかも怪しい代物だった。後に八咫鏡の作者、石凝宮なみの手で、隔世との結び付きが弱められ、別の歴史を歩む異世界となった。
    content_en: |
      An alternate world that serves as one of the main settings of the story. It came into being as the world on the other side of the Yata Mirror, one of the Three Sacred Treasures of Japanese mythology. Conversely, the world on this side is called the Kakusē in Kagamito.

      In the mythological age, it was merely a reflection of the Kakusē in the mirror, to the extent that it was questionable whether it could even be called another world. Later, Nami Ishikokoronomiya, the creator of the Yata Mirror, weakened its connection to the Kakusē, transforming it into an alternate world that would follow a different history.

  - align: left
    content_ja: |
      「私に言わせれば、こっちこそ鏡の外だよ」
    content_en: |
      “If you ask me, this side is the one outside the mirror.”

  - align: right
    content_ja: |
      ───　御虹重
    content_en: |
      ───　Mikō Kasane
