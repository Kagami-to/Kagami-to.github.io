    content_ja: |
      双結八耶にとって初めてとなるメモランダム勝負の相手。
      双結零夜からは、八耶の力を試し、見込みがあれば力を与えるように依頼されていた。勝負ののち、八耶に図書館へ向かうよう告げる。
    content_en: |
      Futayui Yaya’s first opponent in a Memorandum match.
      Futayui Rēya had asked her to test Yaya’s abilities and, if she showed promise, grant her additional power. After the match, she told Yaya to head to the library.

