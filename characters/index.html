<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Characters - Kagamito Official</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="../" class="site-title">Kagamito Official</a>
    <nav>
      <a href="./">Characters</a>
      <a href="../works/">Works</a>
      <a href="../songs/">Songs</a>
    </nav>
  </header>
  <main class="container">
    <h1>Characters</h1>
    <p>characters.csv のデータから生成されるキャラクター一覧です。</p>
    <ul id="character-list" class="character-list"></ul>
    <p id="error" hidden></p>
  </main>
  <script>
    const csvUrl = '../kagamito/pages/characters.csv';

    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quoted) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else quoted = false;
          } else field += c;
        } else {
          if (c === '"') quoted = true;
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else if (c !== '\r') field += c;
        }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      const headers = rows.shift().map(v => v.trim());
      return rows.filter(r => r.some(v => v.trim() !== '')).map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] ?? '').trim()])));
    }

    async function loadCharacters() {
      const list = document.getElementById('character-list');
      const error = document.getElementById('error');
      try {
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error(`CSVを読み込めませんでした (${response.status})`);
        const characters = parseCSV(await response.text());
        characters.forEach(character => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          const urlId = character['URL ID'];
          a.href = urlId ? `${encodeURIComponent(urlId)}.html` : `C${character['Character ID']}.html`;
          a.textContent = character['日本語名'] || character['Character ID'];
          li.appendChild(a);
          list.appendChild(li);
        });
      } catch (e) {
        error.hidden = false;
        error.textContent = e.message;
      }
    }
    loadCharacters();
  </script>
</body>
</html>
