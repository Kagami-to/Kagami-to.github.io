<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Characters - Kagamito Official</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="site-header"><a href="../" class="site-title">鏡外 - Kagamito Official Site</a><nav></nav></header><main class="container"><div class="page-heading"><h1 id="page-title">Characters</h1><div class="page-sub" id="page-sub">キャラクター</div></div><ul id="character-list" class="character-list"></ul><p id="error" hidden></p></main><script src="../assets/js/language.js"></script><script src="../assets/js/entity-pages.js"></script><script>document.documentElement.lang=getLanguage();document.getElementById('page-title').textContent=t('characters');document.getElementById('page-sub').textContent=getLanguage()==='en'?'':'キャラクター';async function load(){try{const r=await fetch('../kagamito/pages/characters.csv');if(!r.ok)throw Error(`CSV error (${r.status})`);const rows=parseCSV(await r.text()).filter(c=>c.url_id&&(c.name_ja||c.name_en));const list=document.getElementById('character-list');rows.forEach(c=>{const li=document.createElement('li'),a=document.createElement('a'),url=String(c.url_id).toLowerCase().replace(/\./g,'-');a.href=`${encodeURIComponent(url)}.html`;const ep=document.createElement('span');ep.className='character-epithet';const main=document.createElement('span');main.className='list-main';const jp=document.createElement('span');jp.className='list-japanese';if(getLanguage()==='en'){ep.textContent=c.epithet_en||c.epithet_ja||'';main.textContent=c.name_en||c.name_ja||'';jp.textContent=c.name_ja||'';a.append(ep,main,jp)}else{ep.textContent=c.epithet_ja||c.epithet_en||'';main.textContent=c.name_ja||c.name_en||'';a.append(ep,main)}li.appendChild(a);list.appendChild(li)})}catch(e){const x=document.getElementById('error');x.hidden=false;x.textContent=e.message}}load();</script><script src="../assets/js/menu.js"></script></body></html>
