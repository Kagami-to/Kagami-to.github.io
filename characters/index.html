<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Characters - Kagamito Official</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="site-header"><a href="../" class="site-title">Kagamito Official</a><nav><a href="./" data-i18n="characters">Characters</a><a href="../works/" data-i18n="works">Works</a><a href="../songs/" data-i18n="songs">Songs</a><span id="language-switch"></span></nav></header><main class="container"><h1 id="page-title">Characters</h1><p id="description">characters.csv のデータから生成されるキャラクター一覧です。</p><ul id="character-list" class="character-list"></ul><p id="error" hidden></p></main><script src="../assets/js/language.js"></script><script>document.getElementById('language-switch').innerHTML=langButton();document.documentElement.lang=getLanguage();document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.getElementById('page-title').textContent=t('characters');document.getElementById('description').textContent=getLanguage()==='en'?'A list of characters from characters.csv.':'characters.csv のデータから生成されるキャラクター一覧です。';async function load(){try{const r=await fetch('../kagamito/pages/characters.csv');if(!r.ok)throw Error('CSV error');const rows=parseCSV(await r.text()),list=document.getElementById('character-list');rows.forEach(c=>{const li=document.createElement('li'),a=document.createElement('a'),id=c['URL ID'],en=c['English Name']||c['日本語名'],ja=c['日本語名']||c['Character ID'];a.href=`${encodeURIComponent(id)}.html`;if(getLanguage()==='en'){a.innerHTML=`<span class="list-main">${escapeHtml(en)}</span><span class="list-japanese">${escapeHtml(ja)}</span>`}else{a.textContent=ja}li.appendChild(a);list.appendChild(li)})}catch(e){const x=document.getElementById('error');x.hidden=false;x.textContent=e.message}}load()</script></body></html>
