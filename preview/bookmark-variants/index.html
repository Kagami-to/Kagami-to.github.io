<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glossary Icon Preview</title><style>body{margin:0;background:#f2f5f3;color:#174b4d;font-family:sans-serif}.wrap{max-width:1120px;margin:40px auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{min-height:280px;background:#fafafa;box-shadow:0 4px 15px rgba(23,75,77,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}.label{font-size:13px;letter-spacing:.06em}.icon{width:100px;height:130px}.ink{fill:#174b4d;opacity:.78}.line{fill:none;stroke:#174b4d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.cut{fill:#fafafa}.note{font-size:11px;color:#527173;text-align:center;line-height:1.7;padding:0 12px}.section{margin:34px 0 12px}.focus{border:1px solid rgba(23,75,77,.2)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Glossary アイコン案</h1><p>D案「札＋穴」をベースに、30°時計回りへ回転させたバリエーション。</p><div class="grid"><section class="card focus"><div class="label">D — 元案</div><svg class="icon" viewBox="0 0 100 130"><path class="ink" d="M34 27h32v80H34z"/><circle class="cut" cx="50" cy="27" r="4"/><path class="line" d="M50 7v20"/></svg><div class="note">比較用の元のD案。</div></section><section class="card focus"><div class="label">D' — 30°回転</div><svg class="icon" viewBox="0 0 100 130"><g transform="rotate(30 50 65)"><path class="ink" d="M34 27h32v80H34z"/><circle class="cut" cx="50" cy="27" r="4"/><path class="line" d="M50 7v20"/></g></svg><div class="note">D案をそのまま30°時計回り。</div></section><section class="card focus"><div class="label">D'' — 30°・紐短め</div><svg class="icon" viewBox="0 0 100 130"><g transform="rotate(30 50 65)"><path class="ink" d="M34 27h32v80H34z"/><circle class="cut" cx="50" cy="27" r="4"/><path class="line" d="M50 13v14"/></g></svg><div class="note">回転後に紐だけ少し短く。</div></section><section class="card focus"><div class="label">D''' — 30°・札細め</div><svg class="icon" viewBox="0 0 100 130"><g transform="rotate(30 50 65)"><path class="ink" d="M36 27h28v80H36z"/><circle class="cut" cx="50" cy="27" r="4"/><path class="line" d="M50 7v20"/></g></svg><div class="note">回転後に札を少し細く。</div></section></div></main></body></html>
