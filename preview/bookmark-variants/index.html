<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glossary Bookmark Preview</title><style>body{margin:0;background:#f2f5f3;color:#174b4d;font-family:sans-serif}.wrap{max-width:900px;margin:40px auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.card{min-height:280px;background:#fafafa;box-shadow:0 4px 15px rgba(23,75,77,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}.label{font-size:14px;letter-spacing:.08em}.icon{width:90px;height:150px}.paper{fill:#174b4d;opacity:.78}.string{fill:none;stroke:#174b4d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.note{font-size:12px;color:#527173;text-align:center;line-height:1.7}.bookmark-a{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>栞アイコン案</h1><p>A案を修正。紙札を完全な長方形にし、穴や円形の描画を使わず、紐と紙札だけのシンプルなピクトグラムに。</p><div class="grid"><section class="card"><div class="label">A — 修正版</div><svg class="icon bookmark-a" viewBox="0 0 90 150" aria-label="和風の栞"><path class="string" d="M45 8v35"/><path class="paper" d="M25 43h40v94H25z"/></svg><div class="note">長方形の紙札＋一本の紐。<br>穴や切り込みを省略したピクトグラム。</div></section><section class="card"><div class="label">A' — 紐を少し長く</div><svg class="icon bookmark-a" viewBox="0 0 90 150" aria-label="和風の栞"><path class="string" d="M45 5v43"/><path class="paper" d="M25 48h40v89H25z"/></svg><div class="note">カード上で紐を少し目立たせる案。</div></section><section class="card"><div class="label">A'' — 紙札を細く</div><svg class="icon bookmark-a" viewBox="0 0 90 150" aria-label="和風の栞"><path class="string" d="M45 8v39"/><path class="paper" d="M30 47h30v90H30z"/></svg><div class="note">より細長い、古風な栞らしい比率。</div></section></div></main></body></html>
