<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glossary Bookmark Preview</title><style>body{margin:0;background:#f2f5f3;color:#174b4d;font-family:sans-serif}.wrap{max-width:1100px;margin:40px auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{min-height:300px;background:#fafafa;box-shadow:0 4px 15px rgba(23,75,77,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.label{font-size:13px;letter-spacing:.06em}.icon{width:90px;height:160px}.paper{fill:#174b4d;opacity:.78}.string{fill:none;stroke:#174b4d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.note{font-size:11px;color:#527173;text-align:center;line-height:1.7;padding:0 12px}.sub{font-size:10px;color:#718080;margin-top:-14px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>栞アイコン案</h1><p>A''の細長い紙札をベースに、上部の二股の紐を復活。紐の形と紙札の比率を変えた案を並べています。</p><div class="grid"><section class="card"><div class="label">A — 浅い二股</div><svg class="icon" viewBox="0 0 90 160"><path class="string" d="M45 8C45 23 31 25 31 42M45 8C45 23 59 25 59 42M31 42C31 47 37 50 45 50M59 42C59 47 53 50 45 50"/><path class="paper" d="M30 49h30v91H30z"/></svg><div class="note">左右に浅く広がってから中央へ収束。</div></section><section class="card"><div class="label">B — 大きめ二股</div><svg class="icon" viewBox="0 0 90 160"><path class="string" d="M45 8C45 25 24 27 24 45M45 8C45 25 66 27 66 45M24 45C24 52 35 55 45 55M66 45C66 52 55 55 45 55"/><path class="paper" d="M30 54h30v86H30z"/></svg><div class="note">紐の存在感を強めた案。</div></section><section class="card"><div class="label">C — やわらかい紐</div><svg class="icon" viewBox="0 0 90 160"><path class="string" d="M45 8C45 20 35 26 28 39C25 45 31 51 45 54M45 8C45 20 55 26 62 39C65 45 59 51 45 54"/><path class="paper" d="M31 53h28v87H31z"/></svg><div class="note">曲線を増やして実物の紐らしさを残す案。</div></section><section class="card"><div class="label">D — 収束を短く</div><svg class="icon" viewBox="0 0 90 160"><path class="string" d="M45 8C45 22 34 29 34 42M45 8C45 22 56 29 56 42M34 42C34 48 40 51 45 51M56 42C56 48 50 51 45 51"/><path class="paper" d="M28 50h34v90H28z"/></svg><div class="note">二股を小さくまとめた控えめな案。</div></section><section class="card"><div class="label">E — 長い二股</div><svg class="icon" viewBox="0 0 90 160"><path class="string" d="M45 8C45 30 27 34 27 52M45 8C45 30 63 34 63 52M27 52C27 57 35 60 45 60M63 52C63 57 55 60 45 60"/><path class="paper" d="M31 59h28v81H31z"/></svg><div class="note">紐を長めにして和装小物感を強調。</div></section><section class="card"><div class="label">F — 非対称気味</div><svg class="icon" viewBox="0 0 90 160"><path class="string" d="M45 8C45 24 29 28 30 43C30 49 37 53 45 54M45 8C45 24 61 27 60 42C60 48 53 52 45 54"/><path class="paper" d="M31 53h28v87H31z"/></svg><div class="note">ほんの少しだけ左右の動きを変えた案。</div></section><section class="card"><div class="label">G — 細紐</div><svg class="icon" viewBox="0 0 90 160"><path class="string" d="M45 8C45 23 31 27 31 43M45 8C45 23 59 27 59 43M31 43C31 48 38 51 45 51M59 43C59 48 52 51 45 51" style="stroke-width:3"/><path class="paper" d="M31 50h28v90H31z"/></svg><div class="note">紐を細くして紙札を主役に。</div></section><section class="card"><div class="label">H — 太紐</div><svg class="icon" viewBox="0 0 90 160"><path class="string" d="M45 8C45 23 31 27 31 43M45 8C45 23 59 27 59 43M31 43C31 48 38 51 45 51M59 43C59 48 52 51 45 51" style="stroke-width:7"/><path class="paper" d="M31 50h28v90H31z"/></svg><div class="note">小さい表示でも紐を認識しやすい案。</div></section></div></main></body></html>
