<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glossary Bookmark Preview</title><style>body{margin:0;background:#f2f5f3;color:#174b4d;font-family:sans-serif}.wrap{max-width:1100px;margin:40px auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{min-height:300px;background:#fafafa;box-shadow:0 4px 15px rgba(23,75,77,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.label{font-size:13px;letter-spacing:.06em}.icon{width:150px;height:110px}.note{font-size:11px;color:#527173;text-align:center;line-height:1.7;padding:0 12px}.bookmark{fill:#174b4d;opacity:.78}.bookmark-string{fill:none;stroke:#174b4d;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.bookmark-hole{fill:#f2f5f3}.rotate45{transform:rotate(45deg)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>栞アイコン案</h1><p>F案をベースに、紙札へ穴を開けて紐を通す構造に変更。さらに45°時計回りに回転させています。</p><div class="grid"><section class="card"><div class="label">F — 穴＋二股紐</div><svg class="icon" viewBox="0 0 150 110" aria-label="紐を通した栞"><g class="rotate45" transform-origin="75 55"><path class="bookmark" d="M53 48h44v72H53z"/><circle class="bookmark-hole" cx="75" cy="48" r="4"/><path class="bookmark-string" d="M75 5C75 19 59 23 60 36C60 42 67 46 75 48M75 5C75 19 91 22 90 35C90 41 83 46 75 48"/></g></svg><div class="note">F案の非対称な紐＋穴を通した構造。</div></section><section class="card"><div class="label">F' — 浅め</div><svg class="icon" viewBox="0 0 150 110"><g class="rotate45" transform-origin="75 55"><path class="bookmark" d="M54 50h42v70H54z"/><circle class="bookmark-hole" cx="75" cy="50" r="4"/><path class="bookmark-string" d="M75 8C75 20 63 24 63 37C63 43 69 47 75 50M75 8C75 20 87 23 87 36C87 42 81 47 75 50"/></g></svg><div class="note">二股の広がりを控えめにした案。</div></section><section class="card"><div class="label">F'' — 長め</div><svg class="icon" viewBox="0 0 150 110"><g class="rotate45" transform-origin="75 55"><path class="bookmark" d="M55 46h40v74H55z"/><circle class="bookmark-hole" cx="75" cy="46" r="4"/><path class="bookmark-string" d="M75 3C75 19 57 24 57 38C57 43 66 46 75 46M75 3C75 19 93 23 93 37C93 43 84 46 75 46"/></g></svg><div class="note">紐を長くして存在感を出した案。</div></section><section class="card"><div class="label">G — やや整然</div><svg class="icon" viewBox="0 0 150 110"><g class="rotate45" transform-origin="75 55"><path class="bookmark" d="M55 48h40v72H55z"/><circle class="bookmark-hole" cx="75" cy="48" r="4"/><path class="bookmark-string" d="M75 6C75 22 62 25 62 39C62 44 68 47 75 48M75 6C75 22 88 25 88 39C88 44 82 47 75 48"/></g></svg><div class="note">左右差を抑えてピクトグラム寄りに。</div></section></div></main></body></html>
