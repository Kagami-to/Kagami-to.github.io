<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Preview 092 — C001</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@300;400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
:root{--green:#2d6869;--green-dark:#234f50;--paper:#f2f5f3;--line:#d9dfdc}
*{box-sizing:border-box}html{background:#fafafa}body{margin:0;background:#fafafa;color:#222;font-family:'Zen Kaku Gothic New',sans-serif}.preview{background:var(--green-dark);color:#fff;text-align:center;padding:9px 14px;font-size:11px}.wrap{width:min(1040px,calc(100% - 32px));margin:auto;padding:24px 0 60px}.toolbar{display:flex;align-items:center;margin-bottom:18px}.back{display:inline-block;color:var(--green);text-decoration:none;font:400 13px 'Shippori Mincho',serif}.card{background:var(--paper);box-shadow:0 4px 15px rgba(23,75,77,.12);padding:48px 52px 58px;position:relative;overflow:hidden}.card:after{content:'CHARACTERS';position:absolute;right:-28px;top:90px;writing-mode:vertical-rl;font:400 72px 'Shippori Mincho',serif;letter-spacing:.08em;color:rgba(45,104,105,.045);pointer-events:none}.hero{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:58px;align-items:stretch}.hero-info{padding:10px 0 0;display:flex;flex-direction:column;min-width:0}.identity-group{min-width:0;border-left:3px solid var(--green);padding-left:24px}.identity-content{min-width:0;padding-right:17px}.fit-box{position:relative;width:100%;min-width:0}.fit-text{display:block;transform-origin:left center;will-change:transform}.epithet{margin:0 0 6px;font:400 14px/1.5 'Zen Kaku Gothic New',sans-serif;color:#555;letter-spacing:.08em}.name{margin:0;font:500 clamp(42px,5.5vw,68px)/1.16 'Shippori Mincho',serif;letter-spacing:.08em}.secondary-name{margin:5px 0 0;font:400 12px/1.6 'Zen Kaku Gothic New',sans-serif;color:#777;letter-spacing:.06em}.reading{margin:7px 0 0;font:400 11px/1.5 'Zen Kaku Gothic New',sans-serif;color:#777;letter-spacing:.13em}.ability-wrap{margin:28px 0 0}.ability{margin:0;font:400 24px/1.7 'Shippori Mincho',serif;letter-spacing:.06em}.song-section{margin-top:auto;padding-top:28px}.related-list{display:grid;gap:10px}.song-card,.work-card{display:block;background:#fff;border-left:5px solid var(--green);box-shadow:0 4px 15px rgba(23,75,77,.12);padding:17px 20px;color:#263d3d;text-decoration:none;min-height:76px}.song-title,.work-title{font:600 20px/1.45 'Shippori Mincho',serif}.song-subtitle,.work-subtitle{margin-top:4px;font:400 12px/1.55 'Zen Kaku Gothic New',sans-serif;color:#6b7472}.portrait{height:100%;min-height:490px;background:#e8ecea;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#999;font:400 10px/1.5 'Zen Kaku Gothic New',sans-serif;letter-spacing:.12em;text-align:center}.portrait img{width:100%;height:100%;object-fit:cover;display:none}.portrait img.active{display:block}.portrait-label{padding:10px;background:rgba(232,236,234,.82)}.portrait.has-image .portrait-label{display:none}.section{position:relative;z-index:1;margin-top:54px;border-top:1px solid var(--line);padding-top:38px}.heading{margin:0 0 15px;font:500 25px/1.4 'Shippori Mincho',serif;letter-spacing:.08em}.profile{font:400 15px/2.15 'Zen Kaku Gothic New',sans-serif;max-width:760px}.divider{position:relative;z-index:1;display:flex;align-items:center;gap:14px;margin:38px 0 4px;color:var(--green);font:400 15px/1 'Shippori Mincho',serif;letter-spacing:.12em}.divider:before,.divider:after{content:'';height:1px;background:rgba(45,104,105,.48);flex:1}.diamond{font-size:16px;line-height:1;transform:rotate(45deg);display:inline-block}.lang{position:fixed;right:18px;top:18px;z-index:20;border:1px solid rgba(45,104,105,.35);background:var(--paper);color:var(--green);padding:7px 11px;font:400 12px 'Shippori Mincho',serif;cursor:pointer}@media(max-width:760px){.wrap{width:calc(100% - 20px);padding-top:14px}.card{padding:32px 26px 44px}.card:after{font-size:46px;right:-18px;top:90px}.hero{display:flex;flex-direction:column;gap:0}.hero-info{display:contents}.identity-group{order:1;width:100%;padding:0 17px;border-left:3px solid var(--green)}.identity-content{padding:0}.portrait{order:2;min-height:0;aspect-ratio:4/5;width:min(100%,340px);margin:30px auto 0}.ability-wrap{order:3;margin:28px 0 0;padding:0}.song-section{order:4;margin-top:20px;padding:0}.divider{order:5;margin:32px 0 0}.section{margin-top:42px;padding-top:32px}.heading{font-size:22px}.profile{font-size:14px;line-height:2}.song-card,.work-card{padding:16px 18px}.song-title,.work-title{font-size:18px}.lang{right:12px;top:12px}}
</style>
</head>
<body>
<button class="lang" id="langBtn">English</button>
<div class="preview" id="previewLabel">CHARACTER DETAIL 092 — 日本語プレビュー / C001</div>
<main class="wrap">
  <div class="toolbar"><a class="back" href="../../characters/">← Back to Character List</a></div>
  <article class="card">
    <section class="hero">
      <div class="hero-info">
        <div class="identity-group">
          <div class="identity-content">
            <div class="fit-box"><p class="epithet fit-text" id="epithet"></p></div>
            <div class="fit-box"><h1 class="name fit-text" id="name"></h1></div>
            <div class="fit-box"><p class="secondary-name fit-text" id="secondary"></p></div>
            <div class="fit-box"><p class="reading fit-text" id="reading"></p></div>
          </div>
        </div>
        <div class="ability-wrap"><div class="fit-box"><p class="ability fit-text" id="ability"></p></div></div>
        <div class="song-section"><div id="songs" class="related-list"></div></div>
      </div>
      <div class="portrait" id="portrait"><div class="portrait-label" id="portraitLabel">画像</div></div>
    </section>
    <div class="divider" aria-hidden="true"><span></span><span class="diamond">◆</span><span></span></div>
    <section class="section" id="positionSection"><h2 class="heading" id="positionHeading"></h2><div class="profile" id="position"></div></section>
    <section class="section" id="profileSection"><h2 class="heading" id="profileHeading"></h2><div class="profile" id="profile"></div></section>
    <section class="section" id="worksSection"><h2 class="heading" id="worksHeading"></h2><div id="works" class="related-list"></div></section>
  </article>
</main>
<script>
const BASE='../../kagamito/pages/';let character=null,songs=[],works=[],english=false;const $=id=>document.getElementById(id);
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!=='\r')f+=c}if(f||r.length){r.push(f);rows.push(r)}const h=(rows.shift()||[]).map(x=>x.trim());return rows.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])))}
async function csv(n){const r=await fetch(BASE+n,{cache:'no-store'});if(!r.ok)throw Error(n+' の読み込みに失敗しました');return parseCSV(await r.text())}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ids(v){return String(v||'').split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean)}
function fit(el){const b=el.parentElement;el.style.transform='none';el.style.width='auto';el.style.whiteSpace='nowrap';const p=el.cloneNode(true);p.style.cssText='position:absolute;left:-100000px;visibility:hidden;white-space:nowrap;width:max-content;transform:none';document.body.appendChild(p);const n=p.getBoundingClientRect().width;p.remove();const a=b.clientWidth;if(!a||n<=a)return;const z=a/n;if(z>=.5)el.style.transform='scaleX('+z+')';else{el.style.width='100%';el.style.whiteSpace='normal'}}
function fitAll(){document.querySelectorAll('.fit-text').forEach(fit)}
function card(x,type){const main=english?(x.title_en||x.title_ja||x[type==='song'?'song_id':'work_id']):(x.title_ja||x.title_en||x[type==='song'?'song_id':'work_id']);const sub=english?(x.title_ja||''):(x.title_en||'');const id=type==='song'?x.song_id:x.work_id;const path=type==='song'?'../../songs/'+id+'.html':'../../works/'+id+'.html';return `<a class="${type}-card" href="${esc(path)}"><div class="${type}-title">${esc(main)}</div>${sub?`<div class="${type}-subtitle">${esc(sub)}</div>`:''}</a>`}
function images(c){const p=$('portrait');const path=String(c.appearance_image||'').trim();if(!path){p.classList.remove('has-image');$('portraitLabel').textContent=english?'IMAGE':'画像';return}const im=document.createElement('img');im.src=/^(\/|https?:)/i.test(path)?path:'../../'+path;im.alt=c.name_ja||c.name_en||'';im.className='active';p.insertBefore(im,p.firstChild);p.classList.add('has-image')}
function render(){const c=character;if(!c)return;document.documentElement.lang=english?'en':'ja';$('langBtn').textContent=english?'日本語':'English';$('previewLabel').textContent=english?'CHARACTER DETAIL 092 — English Preview / C001':'CHARACTER DETAIL 092 — 日本語プレビュー / C001';$('epithet').textContent=english?(c.epithet_en||''):(c.epithet_ja||'');$('name').textContent=english?(c.name_en||''):(c.name_ja||'');$('secondary').textContent=english?(c.name_ja||''):'';
$('reading').textContent=english?'':(c.reading_ja||'');const ab=english?(c.ability_en||''):(c.ability_ja||'');$('ability').textContent=ab;$('ability').parentElement.parentElement.style.display=ab?'':'none';const ts=ids(c.theme_song_ids).map(id=>songs.find(x=>x.song_id===id)).filter(Boolean);$('songs').innerHTML=ts.map(x=>card(x,'song')).join('');const po=english?(c.position_en||''):(c.position_ja||'');$('positionHeading').textContent=english?'Position':'立場';$('position').textContent=po;$('positionSection').style.display=po?'':'none';const pr=english?(c.profile_en||''):(c.profile_ja||'');$('profileHeading').textContent=english?'Profile':'プロフィール';$('profile').textContent=pr;$('profileSection').style.display=pr?'':'none';const ws=ids(c.appearance_work_ids).map(id=>works.find(x=>x.work_id===id)).filter(Boolean);$('worksHeading').textContent=english?'Works':'登場作品';$('works').innerHTML=ws.map(x=>card(x,'work')).join('');$('worksSection').style.display=ws.length?'':'none';$('portraitLabel').textContent=english?'IMAGE':'画像';fitAll()}
$('langBtn').onclick=()=>{english=!english;render()};(async()=>{try{const [charactersData,songsData,worksData]=await Promise.all([csv('characters.csv'),csv('songs.csv'),csv('works.csv')]);character=charactersData.find(c=>c.character_id==='C001');songs=songsData;works=worksData;if(!character)throw Error('C001 が見つかりません');render()}catch(e){document.querySelector('.card').innerHTML='<div>'+esc(e.message)+'</div>'}})();window.addEventListener('resize',fitAll);
</script>
</body>
</html>
