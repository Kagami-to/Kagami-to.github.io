<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 042 | Large Logo Size Comparison</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--teal:#174b4d;--paper:#f8f7f3;--ink:#173b3c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif}.title{text-align:center;padding:50px 20px 32px;font-family:'Shippori Mincho',serif}.title h1{margin:0;font-size:30px;font-weight:500}.title p{margin:10px 0 0;font-size:14px;opacity:.7}.grid{width:min(1200px,94vw);margin:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:28px}.sample{position:relative;overflow:hidden;min-height:520px;background:var(--teal);display:flex;align-items:center;justify-content:center}.sample:before{content:"";position:absolute;width:74%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 45% 42%,rgba(255,255,255,.12),rgba(255,255,255,.055) 48%,rgba(9,41,43,.08) 74%,rgba(9,41,43,0) 75%);border:1px solid rgba(255,255,255,.09)}.logo{position:relative;z-index:1;width:var(--size);height:auto;display:block;max-width:none;filter:drop-shadow(0 8px 20px rgba(0,0,0,.18))}.label{position:absolute;left:18px;bottom:15px;color:rgba(255,255,255,.85);font-size:13px;letter-spacing:.08em}.wide{grid-column:1/-1;min-height:650px}.note{width:min(900px,88vw);margin:35px auto 80px;text-align:center;font-family:'Shippori Mincho',serif;line-height:2;font-size:17px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.sample{min-height:500px}.wide{min-height:600px}}</style></head><body><header class="title"><h1>ロゴサイズ比較・大型</h1><p>70% ～ 250% ― 背景円の中心とロゴの中心はすべて同一</p></header><main class="grid"><div class="sample"><img class="logo" style="--size:70%" src="/1000019929.svg"><span class="label">A / 70%</span></div><div class="sample"><img class="logo" style="--size:90%" src="/1000019929.svg"><span class="label">B / 90%</span></div><div class="sample"><img class="logo" style="--size:110%" src="/1000019929.svg"><span class="label">C / 110%</span></div><div class="sample"><img class="logo" style="--size:140%" src="/1000019929.svg"><span class="label">D / 140%</span></div><div class="sample"><img class="logo" style="--size:180%" src="/1000019929.svg"><span class="label">E / 180%</span></div><div class="sample wide"><img class="logo" style="--size:250%" src="/1000019929.svg"><span class="label">F / 250%</span></div></main><p class="note">大きいサイズでは、ロゴが背景円から大きくはみ出す状態も確認できます。実際のタイトル画面でどこまで大きく見せるかを比較するためのPreviewです。</p></body></html>
