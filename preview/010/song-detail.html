<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song Preview 010 - Kagamito Official</title><link rel="stylesheet" href="../../assets/css/style.css"><link rel="stylesheet" href="../../assets/css/character-detail.css"><style>.song-preview-page{width:100%;padding:92px 0 0;background:#fafafa;color:#222;font-family:"Zen Kaku Gothic New",sans-serif}.song-preview-wrap{width:min(1040px,calc(100% - 32px));margin:auto;padding:24px 0 60px}.song-preview-card{background:#f2f5f3;box-shadow:0 4px 15px rgba(23,75,77,.12);padding:48px 52px 58px;position:relative;overflow:hidden}.preview-label{margin:0 0 30px;color:#718080;font-size:12px;letter-spacing:.12em}.song-title-group{border-left:3px solid #2d6869;padding-left:24px;min-width:0}.song-fit{display:block;transform-origin:left top}.song-scene-top{margin:0 0 6px;font:400 14px/1.5 "Zen Kaku Gothic New",sans-serif;color:#555;letter-spacing:.08em}.song-title{margin:0;font:500 clamp(42px,5.5vw,68px)/1.16 "Shippori Mincho",serif;letter-spacing:.08em;color:#174b4d}.song-title-sub{margin:5px 0 0;font:400 12px/1.6 "Zen Kaku Gothic New",sans-serif;color:#777;letter-spacing:.06em}.song-video{width:100%;margin-top:42px}.song-video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#dbe5e3;box-shadow:0 4px 15px rgba(23,75,77,.12)}.song-video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.song-info{margin-top:42px}.song-info-section{margin:0 0 30px}.song-info-label{margin:0 0 8px;font:500 25px/1.4 "Shippori Mincho",serif;letter-spacing:.08em}.song-link-stack{display:grid;gap:14px}.song-divider{display:flex;align-items:center;gap:14px;margin:48px 0 42px;color:#2d6869}.song-divider:before,.song-divider:after{content:"";height:1px;background:rgba(45,104,105,.48);flex:1}.song-divider span{font-size:16px}.song-detail-placeholder{min-height:120px;color:#718080;font-size:14px;line-height:1.9}.old-youtube{margin-top:42px;padding-top:24px;border-top:1px solid #d9dfdc;color:#718080;font-size:12px}.old-youtube a{color:#315f61}@media(max-width:700px){.song-preview-wrap{width:min(1040px,calc(100% - 20px));padding-top:14px}.song-preview-card{padding:32px 26px 44px}.song-title-group{padding-left:17px}.song-title{font-size:clamp(42px,12vw,58px)}.song-video,.song-info{margin-top:30px}.song-info-label{font-size:22px}.song-divider{margin:38px 0 32px}}
</style></head><body><header class="site-header"><a href="../../" class="site-title"><span class="site-title-ja">鏡外 - </span>Kagamito Official Site</a><nav></nav></header><main class="song-preview-page"><div class="song-preview-wrap"><article class="song-preview-card" id="song-page"><p>Loading…</p></article></div></main><script src="../../assets/js/data.js"></script><script src="../../assets/js/language.js"></script><script src="../../assets/js/entity-pages.js"></script><script src="../../assets/js/character-pages.js"></script><script>
const PREVIEW_SONG_ID='M029',MIN_SCALE=.5,EPS=.5;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function val(r,j,e){return getLanguage()==='en'?(r[e]||r[j]||''):(r[j]||r[e]||'')}function embed(url){try{const u=new URL(url);const id=u.hostname==='youtu.be'?u.pathname.slice(1):u.hostname.includes('youtube.com')?(u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop()):'';return id?'https://www.youtube.com/embed/'+encodeURIComponent(id):''}catch(e){return ''}}
function naturalWidth(el){const old=[el.style.width,el.style.maxWidth,el.style.whiteSpace,el.style.transform];el.style.width='max-content';el.style.maxWidth='none';el.style.whiteSpace='nowrap';el.style.transform='none';const w=el.getBoundingClientRect().width;[el.style.width,el.style.maxWidth,el.style.whiteSpace,el.style.transform]=old;return w}
function lineRects(el){const range=document.createRange();range.selectNodeContents(el);const rs=[...range.getClientRects()].filter(r=>r.width>0&&r.height>0);const lines=[];for(const r of rs){let line=lines.find(x=>Math.abs(x.top-r.top)<2);if(!line)lines.push(line={top:r.top,left:r.left,right:r.right,width:0});line.left=Math.min(line.left,r.left);line.right=Math.max(line.right,r.right);line.width=line.right-line.left}return lines}
function fitSongText(el){const parent=el.parentElement,available=parent?.clientWidth;if(!available)return;const natural=naturalWidth(el);if(!natural)return;const ratio=available/natural;let n=Math.max(1,Math.ceil(.5/ratio));
for(;n<=10;n++){let scale=Math.min(1,Math.max(MIN_SCALE,ratio*n));for(let i=0;i<8;i++){el.style.whiteSpace='normal';el.style.maxWidth='none';el.style.width=`${100/scale}%`;el.style.transform='none';void el.offsetWidth;let lines=lineRects(el);if(lines.length>n){scale=Math.max(MIN_SCALE,scale*.94);continue}const maxLine=Math.max(...lines.map(x=>x.width),0);if(!maxLine){break}const needed=Math.min(1,available/maxLine);if(needed>=scale-EPS/available){el.style.transform=`scaleX(${scale})`;el.style.transformOrigin='left top';return}scale=Math.max(MIN_SCALE,Math.min(scale,needed*.995));} }
el.style.width='100%';el.style.transform='none';el.style.whiteSpace='normal'}
function fitAll(){document.querySelectorAll('.song-fit').forEach(fitSongText)}
async function render(){const [songs,chars,works]=await Promise.all([loadCSV('../../data/songs.csv'),loadCSV('../../data/characters.csv'),loadCSV('../../data/works.csv')]);const s=songs.find(r=>(r.song_id||'').trim()===PREVIEW_SONG_ID),t=document.getElementById('song-page');if(!s){t.innerHTML='<p>Song data not found.</p>';return}const en=getLanguage()==='en',title=val(s,'title_ja','title_en'),scene=val(s,'scene_ja','scene_en'),ja=en?(s.title_ja||''):'';const w=works.find(r=>(r.work_id||'').trim()===(s.work_id||'').trim()),ids=String(s.theme_character_ids||'').split(/[、,;\s]+/).filter(Boolean),cs=ids.map(id=>chars.find(r=>(r.character_id||'').trim()===id.trim()||(r.url_id||'').trim().toLowerCase()===id.trim().toLowerCase())).filter(Boolean),video=embed(s.youtube_url);const cards=cs.map(c=>characterRelatedCard(`/characters/${characterUrl(c.url_id)}.html`,characterValue(c,'name_ja','name_en')||c.character_id,en?(c.name_ja||''):(c.name_en||''),'work')).join(''),wc=w?characterRelatedCard(`/works/${characterUrl(w.url_id)}.html`,characterValue(w,'title_ja','title_en')||w.work_id,en?(w.title_ja||''):(w.title_en||''),'work'):'';t.innerHTML=`<p class="preview-label">PREVIEW 010 / SONG DETAIL — HYBRID FIT TEST</p><div class="song-title-group"><p class="song-scene-top song-fit">${esc(scene)}</p><h1 class="song-title song-fit">${esc(title)}</h1>${ja?`<p class="song-title-sub song-fit">${esc(ja)}</p>`:''}</div><div class="song-video">${video?`<div class="song-video-frame"><iframe src="${esc(video)}" title="${esc(title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`:'<p>Current YouTube video is not available.</p>'}</div><div class="song-info">${cs.length?`<section class="song-info-section"><h2 class="song-info-label">${en?'Theme Character':'テーマキャラクター'}</h2><div class="song-link-stack">${cards}</div></section>`:''}${w?`<section class="song-info-section"><h2 class="song-info-label">${en?'Work':'作品'}</h2><div class="song-link-stack">${wc}</div></section>`:''}</div><div class="song-divider"><span>◆</span></div><section class="song-detail-placeholder"><p>${en?'Additional song details will be placed here.':'今後、楽曲に関する詳細情報をここに追加します。'}</p></section>${s.old_youtube_url?`<aside class="old-youtube"><strong>${en?'Older YouTube':'旧YouTube'}</strong><br>${en?'Previous video: ':'以前の動画：'}<a href="${esc(s.old_youtube_url)}" target="_blank" rel="noopener">${esc(s.old_youtube_url)}</a></aside>`:''}`;fitAll()}document.documentElement.lang=getLanguage();render().catch(e=>document.getElementById('song-page').innerHTML=`<p>${esc(e.message)}</p>`);window.addEventListener('resize',fitAll);</script><script src="../../assets/js/menu.js"></script></body></html>
