<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Preview 090 — C001</title><style>@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@300;400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');*{box-sizing:border-box}html{background:#fafafa}body{margin:0;background:#fafafa;color:#222;font-family:'Zen Kaku Gothic New',sans-serif}.preview{background:#234f50;color:#fff;text-align:center;padding:9px 14px;font-size:11px}.wrap{width:min(1040px,calc(100% - 32px));margin:auto;padding:24px 0 60px}.toolbar{margin-bottom:18px}.back{color:#2d6869;text-decoration:none;font:400 13px 'Shippori Mincho',serif}.card{background:#f2f5f3;box-shadow:0 4px 15px rgba(23,75,77,.12);padding:48px 52px 58px;position:relative;overflow:hidden}.card:after{content:'CHARACTERS';position:absolute;right:-28px;top:90px;writing-mode:vertical-rl;font:400 72px 'Shippori Mincho',serif;letter-spacing:.08em;color:rgba(45,104,105,.045);pointer-events:none}.hero{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:58px;align-items:stretch}.hero-info{padding:10px 0 0;display:flex;flex-direction:column;min-width:0}.identity-group{min-width:0;border-left:3px solid #2d6869;padding-left:24px}.identity-content{min-width:0;padding-right:17px}.fit-box{position:relative;width:100%;min-width:0}.fit-text{display:block;transform-origin:left center;will-change:transform}.epithet{margin:0 0 6px;font:400 14px/1.5 'Zen Kaku Gothic New',sans-serif;color:#555;letter-spacing:.08em}.name{margin:0;font:500 clamp(42px,5.5vw,68px)/1.16 'Shippori Mincho',serif;letter-spacing:.08em}.secondary-name{margin:5px 0 0;font:400 12px/1.6 'Zen Kaku Gothic New',sans-serif;color:#777;letter-spacing:.06em}.reading{margin:7px 0 0;font:400 11px/1.5 'Zen Kaku Gothic New',sans-serif;color:#777;letter-spacing:.13em}.ability-wrap{margin:28px 0 0}.ability-band{background:#234f50;color:#fff;padding:14px 22px 16px;text-align:center}.ability{margin:0;font:400 24px/1.5 'Shippori Mincho',serif;letter-spacing:.06em;color:#fff}.song-section{margin-top:auto;padding-top:22px}.song-heading{margin:0 0 11px;font:500 22px/1.4 'Shippori Mincho',serif;letter-spacing:.08em}.related-list{display:grid;gap:10px}.song-card,.work-card{display:block;background:#fff;border-left:5px solid #2d6869;box-shadow:0 4px 15px rgba(23,75,77,.12);padding:17px 20px;color:#263d3d;text-decoration:none;min-height:76px}.song-title,.work-title{font:600 20px/1.45 'Shippori Mincho',serif}.song-subtitle,.work-subtitle{margin-top:4px;font:400 12px/1.55 'Zen Kaku Gothic New',sans-serif;color:#6b7472}.portrait{height:100%;min-height:490px;background:#e8ecea;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#999;font:400 10px/1.5 'Zen Kaku Gothic New',sans-serif;letter-spacing:.12em;text-align:center}.portrait img{width:100%;height:100%;object-fit:cover;display:block}.portrait-label{padding:10px;background:rgba(232,236,234,.82)}.portrait.has-image .portrait-label{display:none}.hero-divider{position:relative;z-index:1;display:flex;align-items:center;gap:22px;margin:42px 0 0;color:#2d6869}.hero-divider:before,.hero-divider:after{content:'';height:1px;background:#2d6869;opacity:.62;flex:1}.hero-divider-mark{font:400 23px/1 'Shippori Mincho',serif;transform:rotate(45deg);display:block}.section{position:relative;z-index:1;margin-top:54px;border-top:1px solid #d9dfdc;padding-top:38px}.heading{margin:0 0 15px;font:500 25px/1.4 'Shippori Mincho',serif;letter-spacing:.08em}.profile{font:400 15px/2.15 'Zen Kaku Gothic New',sans-serif;max-width:760px}.lang{position:fixed;right:18px;top:18px;z-index:20;border:1px solid rgba(45,104,105,.35);background:#f2f5f3;color:#2d6869;padding:7px 11px;font:400 12px 'Shippori Mincho',serif;cursor:pointer}@media(max-width:760px){.wrap{width:calc(100% - 20px);padding-top:14px}.card{padding:32px 26px 44px}.card:after{font-size:46px;right:-18px;top:90px}.hero{display:flex;flex-direction:column;gap:0}.hero-info{display:contents}.identity-group{order:1;width:100%;padding:0 17px;border-left:3px solid #2d6869}.identity-content{padding:0}.portrait{order:2;min-height:0;aspect-ratio:4/5;width:min(100%,340px);margin:30px auto 0}.ability-wrap{order:3;margin:28px 0 0;padding:0}.ability-band{padding:12px 18px 14px}.ability{font-size:22px}.song-section{order:4;margin-top:20px;padding:0}.hero-divider{margin:38px 0 0;gap:14px}.hero-divider-mark{font-size:25px}.section{margin-top:42px;padding-top:32px}.heading{font-size:22px}.profile{font-size:14px;line-height:2}.song-card,.work-card{padding:16px 18px}.song-title,.work-title{font-size:18px}.lang{right:12px;top:12px}}</style></head><body><button class="lang" id="langBtn">English</button><div class="preview" id="previewLabel">CHARACTER DETAIL 090 — C001 日本語プレビュー</div><main class="wrap"><div class="toolbar"><a class="back" id="back" href="../../characters/">← キャラクター</a></div><article class="card"><section class="hero"><div class="hero-info"><div class="identity-group"><div class="identity-content"><p class="epithet fit-text" id="epithet"></p><h1 class="name fit-text" id="name"></h1><p class="secondary-name fit-text" id="secondary"></p><p class="reading fit-text" id="reading"></p></div></div><div class="ability-wrap" id="abilityWrap"><div class="ability-band"><div class="fit-box"><p class="ability fit-text" id="ability"></p></div></div></div><div class="song-section" id="songSection"><h2 class="song-heading" id="songHeading"></h2><div id="songs" class="related-list"></div></div></div><div class="portrait" id="portrait"><div class="portrait-label" id="portraitLabel">画像</div></div></section><div class="hero-divider" aria-hidden="true"><span class="hero-divider-mark">◇</span></div><section class="section" id="positionSection"><h2 class="heading" id="positionHeading"></h2><div class="profile" id="position"></div></section><section class="section" id="profileSection"><h2 class="heading" id="profileHeading"></h2><div class="profile" id="profile"></div></section><section class="section" id="worksSection"><h2 class="heading" id="worksHeading"></h2><div id="works" class="related-list"></div></section></article></main><script>const BASE='../../kagamito/pages/';let c=null,songs=[],works=[],english=false;const $=id=>document.getElementById(id);function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(f);f=''}else if(ch==='\n'){r.push(f);rows.push(r);r=[];f=''}else if(ch!=='\r')f+=ch}if(f||r.length){r.push(f);rows.push(r)}const h=(rows.shift()||[]).map(x=>x.trim());return rows.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])))}async function csv(n){const r=await fetch(BASE+n,{cache:'no-store'});if(!r.ok)throw Error(n+' の読み込みに失敗しました');return parseCSV(await r.text())}function esc(v){return String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function ids(v){return String(v||'').split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean)}function val(o,j,e){return english?(o[e]||''):(o[j]||'')}function uid(v){return String(v||'').toLowerCase().replace(/\./g,'-')}function fit(el){const b=el.parentElement;el.style.transform='none';el.style.width='auto';el.style.whiteSpace='nowrap';const p=el.cloneNode(true);p.style.cssText='position:absolute;left:-100000px;visibility:hidden;white-space:nowrap;width:max-content;transform:none';document.body.appendChild(p);const n=p.getBoundingClientRect().width;p.remove();const a=b.clientWidth;if(!a||n<=a)return;const z=a/n;if(z>=.5)el.style.transform='scaleX('+z+')';else{el.style.width='100%';el.style.whiteSpace='normal'}}function fitAll(){document.querySelectorAll('.fit-text').forEach(fit)}function card(x,type){const main=type==='song'?(english?(x.title_en||x.title_ja||x.song_id):(x.title_ja||x.title_en||x.song_id)):(english?(x.title_en||x.title_ja||x.work_id):(x.title_ja||x.title_en||x.work_id));const sub=english?(x.title_ja||''):(x.title_en||'');const path=type==='song'?'../../songs/'+uid(x.url_id||x.song_id)+'.html':'../../works/'+uid(x.url_id||x.work_id)+'.html';return `<a class="${type}-card" href="${esc(path)}"><div class="${type}-title">${esc(main)}</div>${sub?`<div class="${type}-subtitle">${esc(sub)}</div>`:''}</a>`}function renderImage(){const p=$('portrait');p.querySelectorAll('img').forEach(x=>x.remove());const paths=String(c.appearance_image||'').split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean);if(!paths.length){p.classList.remove('has-image');$('portraitLabel').textContent=english?'IMAGE':'画像';return}p.classList.add('has-image');const im=document.createElement('img');im.src=/^(\/|https?:)/i.test(paths[0])?paths[0]:'../../'+paths[0];im.alt=c.name_ja||c.name_en||'';p.insertBefore(im,$('portraitLabel'))}function render(){document.documentElement.lang=english?'en':'ja';$('langBtn').textContent=english?'日本語':'English';$('back').textContent=english?'← Characters':'← キャラクター';$('previewLabel').textContent=english?'CHARACTER DETAIL 090 — C001 English Preview':'CHARACTER DETAIL 090 — C001 日本語プレビュー';$('epithet').textContent=val(c,'epithet_ja','epithet_en');$('name').textContent=english?(c.name_en||''):(c.name_ja||'');$('secondary').textContent=english?(c.name_ja||''):(c.name_en||'');$('reading').textContent=english?'':(c.reading_ja||'');const ab=val(c,'ability_ja','ability_en');$('abilityWrap').style.display=ab?'':'none';$('ability').textContent=ab;const ts=ids(c.theme_song_ids).map(id=>songs.find(x=>x.song_id===id)).filter(Boolean);$('songSection').style.display=ts.length?'':'none';$('songHeading').textContent=english?'Theme Song':'テーマ曲';$('songs').innerHTML=ts.map(x=>card(x,'song')).join('');const po=val(c,'position_ja','position_en');$('positionSection').style.display=po?'':'none';$('positionHeading').textContent=english?'Position':'立場';$('position').textContent=po;const pr=val(c,'profile_ja','profile_en');$('profileSection').style.display=pr?'':'none';$('profileHeading').textContent=english?'Profile':'プロフィール';$('profile').textContent=pr;const ws=ids(c.appearance_work_ids).map(id=>works.find(x=>x.work_id===id)).filter(Boolean);$('worksSection').style.display=ws.length?'':'none';$('worksHeading').textContent=english?'Works':'登場作品';$('works').innerHTML=ws.map(x=>card(x,'work')).join('');renderImage();fitAll()}$('langBtn').onclick=()=>{english=!english;render()};(async()=>{try{const [cs,ss,ws]=await Promise.all([csv('characters.csv'),csv('songs.csv'),csv('works.csv')]);c=cs.find(x=>x.character_id==='C001');songs=ss;works=ws;render()}catch(e){document.querySelector('.card').innerHTML='<div>'+esc(e.message)+'</div>'}})();window.addEventListener('resize',fitAll);</script></body></html>
