<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 032 - Kagamito</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#2a2030;font-family:"Zen Kaku Gothic New",sans-serif}.header{position:sticky;top:0;z-index:20;height:68px;background:#4b285f;color:#fff;display:flex;align-items:center;padding:0 18px;box-shadow:0 2px 12px #0003}.brand{font:500 18px "Shippori Mincho",serif}.menu{margin-left:auto;font-size:27px}.hero{position:relative;min-height:760px;overflow:hidden;color:#fff;background:linear-gradient(180deg,#4b285f 0%,#674474 30%,#a27da8 57%,#ded3df 79%,#fff 100%);display:flex;justify-content:center}.shards{position:absolute;inset:0;overflow:hidden;opacity:.46}.shards i{position:absolute;display:block;background:linear-gradient(135deg,#fff9 0%,#cdb7d3 38%,#5a386a 100%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);filter:drop-shadow(0 5px 8px #21132f66)}.s1{width:280px;height:360px;left:3%;top:105px;transform:rotate(-17deg)}.s2{width:215px;height:310px;right:8%;top:65px;transform:rotate(22deg)}.s3{width:180px;height:260px;left:27%;top:310px;transform:rotate(15deg)}.s4{width:320px;height:275px;right:26%;top:335px;transform:rotate(-12deg)}.s5{width:155px;height:235px;left:58%;top:145px;transform:rotate(35deg)}.crack{position:absolute;width:1px;height:520px;left:50%;top:100px;background:#fff9;transform:rotate(23deg);box-shadow:110px 80px 0 -.3px #fff5,-120px 180px 0 -.3px #fff4}.hero-content{position:relative;z-index:2;text-align:center;padding:115px 20px 0;max-width:800px}.hero-kicker{font:500 14px "Zen Kaku Gothic New",sans-serif;letter-spacing:.3em;margin-bottom:25px;opacity:.85}.hero h1{font:600 clamp(48px,9vw,92px)/1.15 "Shippori Mincho",serif;margin:0;text-shadow:0 4px 18px #20112c66}.hero-lead{font:400 clamp(16px,2.3vw,21px)/2 "Shippori Mincho",serif;margin:30px auto 0;max-width:620px}.and-you{margin-top:2em;font:500 clamp(21px,3vw,31px) "Shippori Mincho",serif;letter-spacing:.08em;text-shadow:0 2px 10px #3a244555}.content{max-width:1050px;margin:auto;padding:70px 18px 90px}.world{padding:45px 30px;margin-bottom:75px;background:#fff;text-align:center;border-top:1px solid #d8c9dc;border-bottom:1px solid #d8c9dc}.world h2{font:600 34px "Shippori Mincho",serif;color:#4b285f;margin:0 0 16px}.world p{max-width:760px;margin:0 auto;color:#62566a;line-height:2}.portal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}.portal{display:block;padding:25px 18px;background:#f2e7f3;border:1px solid #d6c5dc;color:#4b285f;text-decoration:none;box-shadow:0 4px 14px #3e254912}.portal strong{display:block;font:600 24px "Shippori Mincho",serif}.portal span{display:block;margin-top:5px;color:#786b86;font-size:12px}.section{margin-bottom:75px}.section-head{background:#e8ddec;border:1px solid #d1bfd8;padding:30px 22px;margin-bottom:20px;text-align:center}.section-head h2{font:600 34px "Shippori Mincho",serif;color:#4b285f;margin:0}.section-head p{margin:7px 0 0;color:#786b86}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{position:relative;padding:18px 18px 18px 24px;background:#fff;border:1px solid #ddd1e1;border-left:5px solid #7b5890;box-shadow:0 4px 14px #3e254912;min-height:108px;display:flex;flex-direction:column;justify-content:center}.ep{font:400 12px/1.4 "Zen Kaku Gothic New",sans-serif;color:#786b86}.name{font:600 22px/1.35 "Shippori Mincho",serif;color:#302337;margin-top:4px}.all{display:block;text-align:center;margin-top:14px;padding:13px;background:#e1d3e9;color:#5b3a78;text-decoration:none}@media(max-width:700px){.hero{min-height:700px}.hero-content{padding-top:90px}.portal-grid{grid-template-columns:1fr}.section-head h2{font-size:29px}.grid{grid-template-columns:1fr}.world{padding:38px 18px}}</style></head><body><header class="header"><div class="brand">鏡外 - Kagamito Official Site</div><div class="menu">☰</div></header><section class="hero"><div class="shards"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i><b class="crack"></b></div><div class="hero-content"><div class="hero-kicker">KAGAMITO</div><h1>鏡の向こうへ</h1><p class="hero-lead">少女は鏡の外へと誘われた。<br>まるで、最初からそう決まっていたかのように。<br><span class="and-you">そして、あなたも。</span></p></div></section><main class="content"><section class="world"><h2>鏡外</h2><p>鏡の向こうに広がる、もうひとつの世界。<br>少女たちは境界を越え、幻想と現実の狭間で物語を紡いでいく。<br>ここでは、登場人物たち、彼女たちの物語、そしてその世界を彩る音楽を紹介します。</p><div class="portal-grid"><a class="portal" href="#characters"><strong>キャラクター</strong><span>CHARACTERS</span></a><a class="portal" href="#works"><strong>作品</strong><span>WORKS</span></a><a class="portal" href="#songs"><strong>楽曲</strong><span>SONGS</span></a></div></section><section class="section" id="characters"><div class="section-head"><h2>キャラクター</h2><p>CHARACTERS</p></div><div class="grid" id="characters-grid"></div></section><section class="section" id="works"><div class="section-head"><h2>作品</h2><p>WORKS</p></div><div class="grid" id="works-grid"></div></section><section class="section" id="songs"><div class="section-head"><h2>楽曲</h2><p>SONGS</p></div><div class="grid" id="songs-grid"></div></section></main><script>async function csv(path){const t=await fetch('/data/'+path+'?preview=032',{cache:'no-store'}).then(r=>r.text());const out=[],re=/\s*(?:"((?:[^"]|"")*)"|([^,\r\n]*))(?:,|\r?\n|$)/g;let row=[],m;while((m=re.exec(t))){row.push(m[1]!==undefined?m[1].replace(/""/g,'"'):m[2]);if(m[0].endsWith('\n')||m[0].endsWith('\r')){if(row.some(x=>x.trim()))out.push(row);row=[]}if(!m[0])break}if(row.length&&row.some(x=>x.trim()))out.push(row);const h=out.shift().map(x=>x.trim());return out.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(ep,name){return `<article class="card"><div class="ep">${esc(ep||'')}</div><div class="name">${esc(name||'')}</div></article>`}async function run(){const [c,w,s]=await Promise.all([csv('characters.csv'),csv('works.csv'),csv('songs.csv')]);document.querySelector('#characters-grid').innerHTML=c.filter(x=>x.url_id).map(x=>card(x.epithet_ja||x.二つ名,x.name_ja||x.本名)).join('');document.querySelector('#works-grid').innerHTML=w.filter(x=>x.url_id||x.work_id).map(x=>card('',x.title_ja)).join('');document.querySelector('#songs-grid').innerHTML=s.filter(x=>x.url_id||x.song_id).map(x=>card('',x.title_ja)).join('')}run().catch(e=>console.error(e))</script></body></html>
