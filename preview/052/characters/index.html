<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Characters - Preview 052</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--teal:#174b4d;--bg:#f7f5ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#294243;font-family:'Zen Kaku Gothic New',sans-serif}.head{background:var(--teal);color:#fff;padding:20px}.brand{font:500 18px 'Shippori Mincho',serif}.wrap{max-width:1050px;margin:auto;padding:42px 18px 90px}h1{font:600 36px 'Shippori Mincho',serif;margin:0 0 10px}.sub{color:#718080;margin:0 0 28px}.rule{height:2px;background:var(--teal);margin-bottom:26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#fff;border-left:5px solid #3f7778;box-shadow:0 4px 14px rgba(23,75,77,.13);padding:22px 20px;min-height:105px;display:flex;flex-direction:column;justify-content:center}.ep{font:400 15px/1.5 'Shippori Mincho',serif;color:#718080;margin-bottom:5px}.name{font:600 21px/1.45 'Shippori Mincho',serif}.status{padding:30px 0;color:#718080}@media(max-width:600px){h1{font-size:30px}.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="brand">鏡外 - Kagamito Official Site</div></header><main class="wrap"><h1>Characters</h1><p class="sub">キャラクター</p><div class="rule"></div><div id="list" class="grid"><div class="status">CSVを読み込んでいます…</div></div></main><script>async function load(){const r=await fetch('/kagamito/pages/characters.csv');const text=await r.text();const rows=parse(text);const h=rows.shift();const ix=Object.fromEntries(h.map((x,i)=>[x,i]));document.querySelector('#list').innerHTML=rows.filter(x=>x[ix.name_ja]).map(x=>`<article class="card"><div class="ep">${esc(x[ix.epithet_ja]||'')}</div><div class="name">${esc(x[ix.name_ja]||'')}</div></article>`).join('')}function parse(s){let a=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){const c=s[i],n=s[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);a.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);a.push(row)}return a}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load().catch(e=>document.querySelector('#list').innerHTML='<div class="status">CSVの読み込みに失敗しました。</div>');</script></body></html>
