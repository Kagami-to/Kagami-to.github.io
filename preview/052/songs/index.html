<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Songs - Preview 052</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--teal:#174b4d;--bg:#f7f5ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#294243;font-family:'Zen Kaku Gothic New',sans-serif}.head{background:var(--teal);color:#fff;padding:20px;display:flex;justify-content:space-between}.brand{font:500 18px 'Shippori Mincho',serif}.lang{border:1px solid #fff;background:transparent;color:#fff;padding:6px 10px}.wrap{max-width:1050px;margin:auto;padding:42px 18px 90px}h1{font:600 36px 'Shippori Mincho',serif;margin:0 0 10px}.sub{color:#718080;margin:0 0 28px}.rule{height:2px;background:var(--teal);margin-bottom:26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#fff;border-left:5px solid #3f7778;box-shadow:0 4px 14px rgba(23,75,77,.13);padding:22px 20px;min-height:108px;display:flex;flex-direction:column;justify-content:center}.main{font:600 20px/1.45 'Shippori Mincho',serif}.secondary{font:400 13px/1.55 'Zen Kaku Gothic New',sans-serif;color:#718080;margin-top:6px}.status{padding:30px 0;color:#718080}@media(max-width:600px){h1{font-size:30px}.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="brand">鏡外 - Kagamito Official Site</div><button class="lang" onclick="toggle()">日本語 / English</button></header><main class="wrap"><h1>Songs</h1><p class="sub">楽曲</p><div class="rule"></div><div id="list" class="grid"><div class="status">CSVを読み込んでいます…</div></div></main><script>let en=new URLSearchParams(location.search).get('lang')==='en';function toggle(){en=!en;history.replaceState(null,'',en?'?lang=en':'?lang=ja');render()}async function render(){const r=await fetch('/kagamito/pages/songs.csv');const text=await r.text();const rows=parse(text);const h=rows.shift();const ix=Object.fromEntries(h.map((x,i)=>[x,i]));document.querySelector('#list').innerHTML=rows.filter(x=>x[ix.title_ja]||x[ix.title_en]).map(x=>{const main=en?x[ix.title_en]:x[ix.title_ja],second=en?x[ix.title_ja]:'';return `<article class="card"><div class="main">${esc(main||'')}</div>${en?`<div class="secondary">${esc(second||'')}</div>`:''}</article>`}).join('')}function parse(s){let a=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){const c=s[i],n=s[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);a.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);a.push(row)}return a}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render().catch(e=>document.querySelector('#list').innerHTML='<div class="status">CSVの読み込みに失敗しました。</div>');</script></body></html>
