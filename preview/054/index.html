<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 054 - Characters</title><style>@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');:root{--teal:#174b4d;--line:#2d6869;--bg:#f8f7f2;--ink:#263d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif}.bar{height:64px;background:var(--teal);color:#fff;display:flex;align-items:center;padding:0 18px}.brand{font:500 17px 'Shippori Mincho',serif}.hamb{margin-left:auto;font-size:25px}.page{max-width:980px;margin:auto;padding:48px 20px 100px}.lang{text-align:right;margin-bottom:22px}.lang button{border:1px solid #aac0be;background:#fff;color:var(--teal);padding:7px 13px;margin-left:4px}.lang button.active{background:var(--teal);color:#fff}.heading{text-align:center;border-bottom:2px solid var(--line);padding-bottom:18px;margin-bottom:30px}.heading h1{margin:0;color:var(--teal);font:600 38px/1.3 'Shippori Mincho',serif}.heading .sub{margin-top:6px;color:#657676;letter-spacing:.16em;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.card{min-height:112px;background:#fff;border-left:5px solid var(--line);box-shadow:0 4px 15px rgba(23,75,77,.12);padding:22px 20px;display:flex;flex-direction:column;justify-content:center}.main{font:600 21px/1.45 'Shippori Mincho',serif}.secondary{margin-top:4px;font-size:13px;line-height:1.5;color:#718080}.id{font-size:11px;color:#879393;margin-bottom:6px}@media(max-width:600px){.page{padding:34px 16px 70px}.heading h1{font-size:31px}.grid{grid-template-columns:1fr}}</style></head><body><header class="bar"><div class="brand" id="brand"></div><div class="hamb">☰</div></header><main class="page"><div class="lang"><button class="active" data-lang="ja">日本語</button><button data-lang="en">English</button></div><section class="heading"><h1 id="headingMain">Characters</h1><div class="sub" id="headingSub">キャラクター</div></section><div class="grid" id="grid"></div></main><script>const BASE='/kagamito/pages/';let lang='ja';function parseCSV(t){const out=[],rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell='';continue}cell+=c}if(cell!==''||row.length){row.push(cell);rows.push(row)}const h=rows.shift()||[];return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}async function load(){const r=await fetch(BASE+'characters.csv');const data=parseCSV(await r.text());document.getElementById('grid').innerHTML=data.map(x=>{const main=lang==='ja'?x.epithet_ja:x.epithet_en;const sec=lang==='ja'?x.name_ja:x.name_en;return `<article class="card"><div class="id">${x.character_id}</div><div class="main">${main||''}</div><div class="secondary">${sec||''}</div></article>`}).join('');document.getElementById('headingSub').textContent=lang==='ja'?'キャラクター':'';document.getElementById('brand').textContent=lang==='ja'?'鏡外 - Kagamito Official Site':'Kagamito Official Site'}document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('active',x===b));load()});load()</script></body></html>
