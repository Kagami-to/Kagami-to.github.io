<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Preview 085</title><style>@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@300;400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');body{font-family:'Zen Kaku Gothic New',sans-serif;margin:0;padding:40px;background:#fafafa;color:#222}.toolbar{max-width:900px;margin:0 auto 20px;display:flex;gap:8px}.card{max-width:900px;margin:auto;padding:40px;background:#f2f5f3;border-left:3px solid #2d6869}.name{font:500 56px/1.2 'Shippori Mincho',serif}.en{font-family:'Shippori Mincho',serif}.sub{color:#777}.section{margin-top:35px;border-top:1px solid #ddd;padding-top:25px}.link{display:block;padding:16px;background:white;margin:8px 0;border-left:5px solid #2d6869;text-decoration:none;color:#222}.error{color:#9b3333;padding:15px;background:#fff0f0}.ability{font:400 24px/1.6 'Shippori Mincho',serif}@media(max-width:700px){body{padding:16px}.card{padding:28px 22px}.name{font-size:42px}}</style></head><body><div class="toolbar"><select id="selector"></select><button id="lang">English</button></div><article class="card"><div id="content">Loading…</div></article><script>let C=[],S={},W={},i=0,en=false;const $=x=>document.getElementById(x);function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let p=0;p<text.length;p++){const ch=text[p],next=text[p+1];if(ch==='"'){if(quoted&&next==='"'){cell+='"';p++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')p++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[]}else cell+=ch}if(cell!==''||row.length){row.push(cell);rows.push(row)}const headers=rows.shift().map(x=>x.trim());return rows.map(r=>Object.fromEntries(headers.map((h,n)=>[h,(r[n]??'').trim()])))}async function load(){try{const base='../../kagamito/pages/';const [cr,sr,wr]=await Promise.all([fetch(base+'characters.csv'),fetch(base+'songs.csv'),fetch(base+'works.csv')]);if(!cr.ok||!sr.ok||!wr.ok)throw new Error('CSVを取得できませんでした');const [ct,st,wt]=await Promise.all([cr.text(),sr.text(),wr.text()]);C=parseCSV(ct);parseCSV(st).forEach(s=>{S[s.song_id]=s});parseCSV(wt).forEach(w=>{W[w.work_id]=w});C.forEach(c=>{const o=document.createElement('option');o.value=c.character_id;o.textContent=c.character_id+' — '+c.name_ja;$('selector').appendChild(o)});render()}catch(e){$('content').innerHTML='<div class="error">データの読み込みに失敗しました。<br>'+e.message+'</div>'}}function fitClass(s){return s?String(s).replace(/[ōīūāēŌĪŪĀĒ]/g,m=>'<span style="font-weight:300">'+m+'</span>'):''}function render(){if(!C.length)return;const c=C[i];$('selector').value=c.character_id;const name=en?c.name_en:c.name_ja,third=en?c.name_ja:c.reading_ja,e=en?c.epithet_en:c.epithet_ja,a=en?c.ability_en:c.ability_ja,p=en?c.position_en:c.position_ja;let out='<div class="sub">'+(e||'')+'</div><div class="name en">'+fitClass(name)+'</div><div class="sub">'+(third||'')+'</div>';if(a)out+='<div class="section ability">'+(a||'')+'</div>';const ids=(c.theme_song_ids||'').split(',').map(x=>x.trim()).filter(Boolean);if(ids.length){out+='<div class="section"><h2>'+(en?'Theme Song':'テーマ曲')+'</h2>';ids.forEach(id=>{const s=S[id];if(s)out+='<a class="link" href="#"><strong>'+fitClass(en?s.title_en:s.title_ja)+'</strong><br><small>'+(en?s.title_ja:s.title_en)+'</small></a>'});out+='</div>'}if(p)out+='<div class="section"><h2>'+(en?'Position':'立場')+'</h2><div>'+p+'</div></div>';const ws=(c.appearance_work_ids||'').split(',').map(x=>x.trim()).filter(Boolean);if(ws.length){out+='<div class="section"><h2>'+(en?'Works':'登場作品')+'</h2>';ws.forEach(id=>{const w=W[id];if(w)out+='<a class="link" href="#"><strong>'+fitClass(en?w.title_en:w.title_ja)+'</strong><br><small>'+(en?w.title_ja:w.title_en)+'</small></a>'});out+='</div>'}if(c.profile_ja||c.profile_en)out+='<div class="section"><h2>'+(en?'Profile':'プロフィール')+'</h2><div>'+(en?c.profile_en:c.profile_ja)+'</div></div>';$('content').innerHTML=out;$('lang').textContent=en?'日本語':'English'}$('selector').onchange=e=>{i=C.findIndex(c=>c.character_id===e.target.value);render()};$('lang').onclick=()=>{en=!en;render()};load()</script></body></html>
