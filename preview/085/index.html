<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Preview 085</title><style>body{font-family:Arial,sans-serif;margin:0;padding:40px;background:#fafafa;color:#222}.card{max-width:900px;margin:auto;padding:40px;background:#f2f5f3;border-left:3px solid #2d6869}.name{font-size:56px}.en{font-family:'Shippori Mincho',serif}.sub{color:#777}.section{margin-top:35px;border-top:1px solid #ddd;padding-top:25px}.link{display:block;padding:16px;background:white;margin:8px 0;border-left:5px solid #2d6869;text-decoration:none;color:#222}.toolbar{margin-bottom:20px}button,select{padding:8px}</style></head><body><div class="toolbar"><select id="selector"></select> <button id="lang">English</button></div><article class="card"><div id="content"></div></article><script>const C="+data_json+";const S="+song_json+";const W="+work_json+";let i=0,en=false;const $=x=>document.getElementById(x);C.forEach(c=>{let o=document.createElement('option');o.value=c.character_id;o.textContent=c.character_id+' — '+c.name_ja;$('selector').appendChild(o)});function render(){let c=C[i];$('selector').value=c.character_id;let name=en?c.name_en:c.name_ja,third=en?c.name_ja:c.reading_ja,e=en?c.epithet_en:c.epithet_ja,a=en?c.ability_en:c.ability_ja,p=en?c.position_en:c.position_ja;let out='<div class="sub">'+(e||'')+'</div><div class="name en">'+(name||'')+'</div><div class="sub">'+(third||'')+'</div>';if(a)out+='<div class="section en">'+a+'</div>';let ids=(c.theme_song_ids||'').split(',').map(x=>x.trim()).filter(Boolean);if(ids.length){out+='<div class="section"><h2>'+(en?'Theme Song':'テーマ曲')+'</h2>';ids.forEach(id=>{let s=S[id];if(s)out+='<a class="link" href="#">'+(en?s[1]:s[0])+'<br><small>'+(en?s[0]:s[1])+'</small></a>'});out+='</div>'}if(p)out+='<div class="section"><h2>'+(en?'Position':'立場')+'</h2><div>'+p+'</div></div>';let ws=(c.appearance_work_ids||'').split(',').map(x=>x.trim()).filter(Boolean);if(ws.length){out+='<div class="section"><h2>'+(en?'Works':'登場作品')+'</h2>';ws.forEach(id=>{let w=W[id];if(w)out+='<a class="link" href="#">'+(en?w[1]:w[0])+'<br><small>'+(en?w[0]:w[1])+'</small></a>'});out+='</div>'}if(c.profile_ja||c.profile_en)out+='<div class="section"><h2>'+(en?'Profile':'プロフィール')+'</h2><div>'+(en?c.profile_en:c.profile_ja)+'</div></div>';$('content').innerHTML=out;$('lang').textContent=en?'日本語':'English'}$('selector').onchange=e=>{i=C.findIndex(c=>c.character_id===e.target.value);render()};$('lang').onclick=()=>{en=!en;render()};render()</script></body></html>
