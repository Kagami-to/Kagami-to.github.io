<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 016 - Kagamito Official</title><style>
:root{--header:#251044;--bg:#f4eef7;--panel:#2f1850;--card:#ffffff;--ink:#24192c;--muted:#bca9c9;--accent:#c7a3dd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}body{overflow-x:hidden}.site-header{position:fixed;top:0;left:0;right:0;height:68px;background:var(--header);color:white;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 2px 12px #0003}.site-title{color:#fff;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:.02em}.menu-toggle{width:48px;height:48px;border:0;background:transparent;color:#fff;padding:10px;cursor:pointer}.hamburger{display:block}.hamburger span{display:block;height:2px;background:#fff;margin:6px 0;transition:.22s}.menu-toggle.menu-open .hamburger span:nth-child(1){transform:translateY(8px) rotate(45deg)}.menu-toggle.menu-open .hamburger span:nth-child(2){opacity:0}.menu-toggle.menu-open .hamburger span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}main{padding:104px 20px 70px;max-width:900px;margin:auto}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:42px;margin:0 0 8px}.hero p{color:#65546d}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:34px}.card{background:var(--card);padding:22px;box-shadow:0 5px 18px #32164416;border:1px solid #e5d9ea}.card h2{margin:0 0 7px;font-size:20px}.card p{margin:0;color:#75657b;line-height:1.7}.overlay{position:fixed;inset:68px 0 0;background:#13081d88;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}.panel{position:fixed;top:68px;right:0;bottom:0;width:min(390px,88vw);background:var(--panel);color:#fff;z-index:25;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:22px 16px 32px;box-shadow:-10px 0 30px #0003}.open{transform:translateX(0)}.overlay.open{opacity:1;pointer-events:auto}.group{margin-bottom:12px}.trigger{width:100%;background:#ffffff10;border:1px solid #ffffff18;color:#fff;text-align:left;padding:15px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.copy{display:flex;flex-direction:column;gap:2px}.mainlabel{font-size:20px;font-weight:700}.sublabel{font-size:12px;color:var(--muted)}.arrow{font-size:14px}.sub{max-height:0;overflow:hidden;transition:max-height .3s ease}.group.open .sub{max-height:1200px}.sub a{display:flex;flex-direction:column;text-decoration:none;color:#fff;background:#ffffff08;border-left:1px solid #ffffff18;border-right:1px solid #ffffff18;border-bottom:1px solid #ffffff10;padding:12px 14px}.sub a:hover{background:#ffffff15}.name{font-size:16px;font-weight:600}.epithet{font-family:Georgia,"Times New Roman",serif;font-size:12px;color:#cdb9d8;margin-top:3px}.all{margin:8px 0 3px!important;color:#eadbf0!important;font-size:13px;flex-direction:row!important;justify-content:space-between}.lang{display:flex;gap:8px;margin-top:22px}.lang button{flex:1;padding:10px;border:0;background:#ffffff10;color:#c8b8d0;cursor:pointer}.lang .active{background:#fff;color:#2f1850;font-weight:700}@media(max-width:600px){.site-title{font-size:16px}.hero h1{font-size:34px}}
</style></head><body><header class="site-header"><a class="site-title" href="#">鏡外 - Kagamito Official Site</a><button id="toggle" class="menu-toggle" aria-label="メニュー"><span class="hamburger"><span></span><span></span><span></span></span></button></header><div id="overlay" class="overlay"></div><aside id="panel" class="panel"><div id="menu"></div><div class="lang"><button id="ja" class="active">日本語</button><button id="en">English</button></div></aside><main><section class="hero"><h1>Characters</h1><p>Preview 016 — CSVから読み込むインタラクティブなナビゲーション</p></section><section class="cards"><article class="card"><h2>CSV-driven menu</h2><p>キャラクターの名前と二つ名をデータから自動取得します。内部IDは表示しません。</p></article><article class="card"><h2>Responsive</h2><p>スマートフォンでも十分なタップ領域を確保し、メニューは右側からスライドします。</p></article><article class="card"><h2>Language</h2><p>日本語では日本語名＋二つ名、英語では英語名＋英語二つ名を表示します。</p></article></section></main><script>
const data=`character_id,url_id,name_ja,name_en,epithet_ja,epithet_en\nC001,yaya,双結八耶,Futayui Yaya,割れた鏡の救世主,Savior of the Broken Mirror\nC002,kotone,上白川琴音,Kamishirakawa Kotone,並外れた琴の天才,Extraordinary Koto Genius\nC003,natano,鶴城なた乃,Tsurushiro Natano,絶たれた夢の修復士,Restorer of Severed Dreams\nC004,oka,猪民桜花,Inotami Oka,廃れた都の生き字引,Living Chronicle of the Forsaken Capital\nC005,ayane,上白川文音,Kamishirakawa Ayane,並外れた文の秀才,Extraordinary Literary Scholar\nC006,allen,アレン・ハーグリーヴズ,Allen Hargreaves,引き継がれた本の虫,Bookworm of the Inherited Passion\nC007,reya,双結零夜,Futayui Rēya,割れた鏡の仲介人,Mediator of the Broken Mirror\nC008,chihaya,稚早,Chihaya,見込まれた単の用心棒,Favored Bodyguard of Hitoe\nC009,kasane,御虹重,Mikō Kasane,選ばれた桜の君,Chosen Lady of Cherry\nC010,hitoe,御虹単,Mikō Hitoe,隠れた橘の君,Hidden Lady of Citrus\nC011,komomo,藤原香桃,Fujiwara Komomo,,\nC012,midori,有手翠,Usu Midori,,\nC013,noah,ノア・アララト,Noah Ararat,,\nC014,magiamalia,メガイアマリア・イオニア,Magiamalia Ionia,,\nC015,yae,櫛稲宮やえ,Kushinamiya no Yae,,`;
let lang='ja';function parse(s){let [h,...ls]=s.split(/\r?\n/);let keys=h.split(',');return ls.map(x=>{let a=x.split(',');return Object.fromEntries(keys.map((k,i)=>[k,a[i]||'']))})}const rows=parse(data);function render(){let m=document.getElementById('menu');m.innerHTML='';let g=document.createElement('div');g.className='group';let b=document.createElement('button');b.className='trigger';b.innerHTML=`<span class="copy"><span class="mainlabel">Characters</span><span class="sublabel">キャラクター</span></span><span class="arrow">▼</span>`;let s=document.createElement('div');s.className='sub';let all=document.createElement('a');all.className='all';all.href='#';all.innerHTML='<span>すべてのキャラクターを見る</span><span>→</span>';s.append(all);rows.forEach(r=>{let a=document.createElement('a');a.href='#';let n=lang==='ja'?r.name_ja:r.name_en;let e=lang==='ja'?r.epithet_ja:r.epithet_en;a.innerHTML=`<span class="name">${n}</span>${e?`<span class="epithet">${e}</span>`:''}`;s.append(a)});g.append(b,s);m.append(g);b.onclick=()=>{g.classList.toggle('open');b.querySelector('.arrow').textContent=g.classList.contains('open')?'▲':'▼'}}render();const t=document.getElementById('toggle'),p=document.getElementById('panel'),o=document.getElementById('overlay');function menu(x){t.classList.toggle('menu-open',x);p.classList.toggle('open',x);o.classList.toggle('open',x)}t.onclick=()=>menu(!p.classList.contains('open'));o.onclick=()=>menu(false);document.getElementById('ja').onclick=()=>{lang='ja';document.getElementById('ja').className='active';document.getElementById('en').className='';render()};document.getElementById('en').onclick=()=>{lang='en';document.getElementById('en').className='active';document.getElementById('ja').className='';render()};
</script></body></html>
