<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 011 - Songs</title><link rel="stylesheet" href="../../../assets/css/style.css"><link rel="stylesheet" href="../../../assets/css/character-detail.css"><link rel="stylesheet" href="./song-detail.css"></head><body><header class="site-header"><a href="../../../" class="site-title"><span class="site-title-ja">鏡外 - </span>Kagamito Official Site</a><nav></nav></header><main class="song-preview-page"><div class="song-preview-wrap"><article class="song-preview-card"><p class="preview-label">PREVIEW 011 / ALL SONGS</p><h1 class="song-title">Songs</h1><p>全楽曲のPreview一覧です。</p><div id="song-list" class="song-link-stack"></div></article></div></main><script src="../../../assets/js/data.js"></script><script src="../../../assets/js/language.js"></script><script>async function run(){const rows=await loadCSV('../../../data/songs.csv');const e=getLanguage()==='en';document.documentElement.lang=e?'en':'ja';document.getElementById('song-list').innerHTML=rows.filter(r=>r.url_id).map(r=>`<a class="character-092-work-card" href="./${String(r.url_id).trim().toLowerCase().replace(/\./g,'-')}.html"><div class="character-092-card-title">${e?(r.title_en||r.title_ja||r.song_id):(r.title_ja||r.title_en||r.song_id)}</div><div class="character-092-card-subtitle">${r.song_id}</div></a>`).join('')}run().catch(e=>console.error(e));</script><script src="../../../assets/js/menu.js"></script></body></html>
