<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song Preview 005 - Kagamito Official</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fafafa}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="preview" src="../004/song-detail.html" title="Song Preview 005"></iframe>
  <script>
    const frame=document.getElementById('preview');
    function fitMultiLine(el){
      const box=el.parentElement;
      if(!box)return;
      el.style.transform='none';
      el.style.width='auto';
      el.style.whiteSpace='nowrap';
      const probe=el.cloneNode(true);
      probe.style.cssText='position:absolute;left:-100000px;top:0;visibility:hidden;white-space:nowrap;width:max-content;transform:none';
      box.ownerDocument.body.appendChild(probe);
      const natural=probe.getBoundingClientRect().width;
      const available=box.clientWidth;
      probe.remove();
      if(!available||natural<=available)return;
      if(available/natural>=0.5){el.style.transform=`scaleX(${available/natural})`;return}

      const baseFont=parseFloat(getComputedStyle(el).fontSize);
      const baseLine=parseFloat(getComputedStyle(el).lineHeight)||baseFont*1.2;
      const maxScale=1;
      const minScale=.5;
      const fits=(scale,lines)=>{
        const p=el.cloneNode(true);
        p.style.cssText=`position:absolute;left:-100000px;top:0;visibility:hidden;white-space:normal;width:${available/scale}px;transform:none;font-size:${baseFont*scale}px;line-height:${baseLine*scale}px`;
        box.ownerDocument.body.appendChild(p);
        const h=p.getBoundingClientRect().height;
        p.remove();
        return h <= baseLine*scale*lines + 1;
      };

      let lines=2;
      let scale=minScale;
      while(lines<=10){
        if(fits(maxScale,lines)){
          scale=1;
          break;
        }
        if(fits(minScale,lines)){
          let lo=minScale,hi=maxScale;
          for(let i=0;i<16;i++){
            const mid=(lo+hi)/2;
            if(fits(mid,lines))lo=mid;else hi=mid;
          }
          scale=lo;
          break;
        }
        lines++;
      }
      el.style.whiteSpace='normal';
      el.style.width=`${100/scale}%`;
      el.style.transform=`scaleX(${scale})`;
      el.style.transformOrigin='left top';
    }

    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc)return;
      const run=()=>doc.querySelectorAll('.character-092-fit-text').forEach(fitMultiLine);
      run();
      frame.contentWindow.addEventListener('resize',run);
    });
  </script>
</body>
</html>
