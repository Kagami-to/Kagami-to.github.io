<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song Preview - Kagamito Official</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    .preview-note{max-width:960px;margin:1rem auto 0;padding:.65rem .9rem;border:1px solid currentColor;font-size:.82rem;opacity:.72}
    .song-detail{max-width:960px;margin:2rem auto 4rem}
    .song-header{margin-bottom:2.5rem}
    .song-header h1{margin:0;font-size:clamp(2rem,5vw,4rem);line-height:1.15}
    .song-english{margin:.6rem 0 0;font-size:1.05rem;opacity:.72}
    .song-meta{display:grid;gap:.9rem;margin:2rem 0}
    .song-meta-item{margin:0}
    .song-meta-label{display:block;font-size:.78rem;letter-spacing:.08em;opacity:.62;margin-bottom:.25rem}
    .song-section{margin:2.2rem 0}
    .song-section h2{margin:0 0 .75rem;font-size:1.15rem}
    .song-section p{margin:0;line-height:1.9;white-space:pre-wrap}
    .song-link{display:inline-block;margin-top:.4rem}
    .song-back{margin-top:3rem}
  </style>
</head>
<body>
  <header class="site-header">
    <a href="../../" class="site-title"><span class="site-title-ja">鏡外 - </span>Kagamito Official Site</a>
    <nav></nav>
  </header>

  <div class="preview-note">PREVIEW 001 — Songs detail page / experimental draft</div>

  <main class="container">
    <article id="song-page" class="song-detail" aria-live="polite">
      <p>Loading…</p>
    </article>
  </main>

  <script src="../../assets/js/data.js"></script>
  <script src="../../assets/js/language.js"></script>
  <script>
    const SONG_ID = 'M001';

    function esc(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    function pick(row, ja, en) {
      return getLanguage() === 'en' ? (row[en] || row[ja] || '') : (row[ja] || row[en] || '');
    }

    function field(label, value) {
      if (!value) return '';
      return `<p class="song-meta-item"><span class="song-meta-label">${esc(label)}</span>${esc(value)}</p>`;
    }

    async function renderSongPreview() {
      const rows = await loadCsv('../../data/songs.csv');
      const row = rows.find(r => (r.song_id || '').trim() === SONG_ID);
      const target = document.getElementById('song-page');
      if (!row) {
        target.innerHTML = '<p>Song data not found.</p>';
        return;
      }

      const en = getLanguage() === 'en';
      const title = pick(row, 'title_ja', 'title_en');
      const subtitle = en ? (row.title_ja || '') : (row.title_en || '');
      const scene = pick(row, 'scene_ja', 'scene_en');
      const description = pick(row, 'description_ja', 'description_en');
      const youtube = row.youtube_url || '';
      const oldYoutube = row.old_youtube_url || '';

      target.innerHTML = `
        <header class="song-header">
          <h1>${esc(title)}</h1>
          ${subtitle ? `<p class="song-english">${esc(subtitle)}</p>` : ''}
        </header>

        <div class="song-meta">
          ${field(en ? 'Song ID' : '楽曲ID', row.song_id)}
          ${field(en ? 'Work' : '作品', row.work_id)}
          ${field(en ? 'Scene' : '場面', scene)}
          ${field(en ? 'Theme Characters' : 'テーマキャラクター', row.theme_character_ids)}
        </div>

        ${description ? `<section class="song-section"><h2>${en ? 'Description' : '楽曲説明'}</h2><p>${esc(description)}</p></section>` : ''}

        ${youtube ? `<section class="song-section"><h2>YouTube</h2><a class="song-link" href="${esc(youtube)}" target="_blank" rel="noopener">${esc(youtube)}</a></section>` : ''}
        ${oldYoutube ? `<section class="song-section"><h2>${en ? 'Previous YouTube' : '旧YouTube'}</h2><a class="song-link" href="${esc(oldYoutube)}" target="_blank" rel="noopener">${esc(oldYoutube)}</a></section>` : ''}

        <p class="song-back"><a href="../../songs/">${en ? 'Back to Songs' : '楽曲一覧へ戻る'}</a></p>
      `;
    }

    document.documentElement.lang = getLanguage();
    renderSongPreview().catch(error => {
      document.getElementById('song-page').innerHTML = `<p>${esc(error.message)}</p>`;
    });
  </script>
  <script src="../../assets/js/menu.js"></script>
</body>
</html>
