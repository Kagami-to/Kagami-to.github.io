<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 013 - Menu</title><style>:root{--purple:#41204f;--panel:#f8f5fa;--item:#eee5f2;--ink:#241d29;--muted:#776b7e}*{box-sizing:border-box}body{margin:0;background:#f2edf4;color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif}body.lock{overflow:hidden}.header{position:fixed;z-index:30;top:0;left:0;right:0;height:68px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-weight:800;text-decoration:none;color:#fff}.toggle{width:52px;height:52px;border:0;background:none;color:#fff;cursor:pointer}.hamb{display:block;width:25px;margin:auto}.hamb i{display:block;height:2px;background:#fff;margin:6px 0;transition:.28s}.toggle.open .hamb i:nth-child(1){transform:translateY(8px) rotate(45deg)}.toggle.open .hamb i:nth-child(2){opacity:0}.toggle.open .hamb i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}.veil{position:fixed;z-index:20;top:68px;left:0;right:0;bottom:0;background:#21152b99;opacity:0;pointer-events:none;transition:.3s}.veil.open{opacity:1;pointer-events:auto}.panel{position:fixed;z-index:25;top:68px;right:0;bottom:0;width:min(90vw,410px);overflow:auto;padding:22px 18px 32px;background:var(--panel);transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);box-shadow:-15px 0 35px #25162e26}.panel.open{transform:none}.group{margin-bottom:9px}.trigger{width:100%;min-height:82px;border:0;background:var(--item);padding:13px 17px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--ink);cursor:pointer}.main{font-size:23px;font-weight:800;line-height:1.1}.sub{display:block;font-size:12px;color:var(--muted);margin-top:5px}.arrow{font-size:17px;color:#603a70}.sublist{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s;background:#e7ddeb}.group.open .sublist{grid-template-rows:1fr}.inner{min-height:0;overflow:hidden}.all,.person{display:block;text-decoration:none;color:var(--ink);border-top:1px solid #d9ccdf}.all{padding:13px 18px;color:#5b3670;font-weight:750;background:#e1d4e7}.person{padding:11px 18px}.person strong{display:block;font-size:15px}.person small{display:block;margin-top:3px;font-size:12px;color:#76697e}.person:hover,.all:hover,.trigger:hover{background:#dac9e1}.content{padding:120px 24px;max-width:900px;margin:auto}.content h1{font-size:42px}.sample{height:900px;background:linear-gradient(#fff,#f4edf7);padding:24px}.label{color:#6a4777}</style></head><body><header class="header"><a class="brand" href="#">鏡外 - Kagamito Official Site</a><button class="toggle" aria-label="menu"><span class="hamb"><i></i><i></i><i></i></span></button></header><div class="veil"></div><aside class="panel"></aside><main class="content"><div class="sample"><p class="label">PREVIEW 013 · Clean Sans</p><h1>Characters</h1><p>メニューを開いて、キャラクター一覧を確認してください。</p><p>このプレビューではIDを隠し、二つ名を補助情報として表示します。</p><div style="height:650px"></div></div></main><script>const data={chars:[],works:[],songs:[]};const panel=document.querySelector('.panel');const base='../';function parseCSV(t){const rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell='';continue}cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])))}async function load(){const [c,w,s]=await Promise.all(['characters','works','songs'].map(x=>fetch(base+'data/'+x+'.csv').then(r=>r.text()).then(parseCSV)));const groups=[['Characters','キャラクター','すべてのキャラクターを見る',c,'name_ja','name_en','epithet_ja','characters'],['Works','作品','すべての作品を見る',w,'title_ja','title_en','subtitle_en','works'],['Songs','楽曲','すべての楽曲を見る',s,'title_ja','title_en','', 'songs']];groups.forEach(g=>{const d=document.createElement('section');d.className='group';d.innerHTML='<button class="trigger"><span><span class="main">'+g[0]+'</span><span class="sub">'+g[1]+'</span></span><span class="arrow">▼</span></button><div class="sublist"><div class="inner"><a class="all" href="'+g[7]+'/index.html">'+g[2]+'　→</a></div></div>';const inner=d.querySelector('.inner');g[3].filter(r=>r.url_id&&(r[g[4]]||r[g[5]])).forEach(r=>{const a=document.createElement('a');a.className='person';a.href=base+g[7]+'/'+r.url_id.toLowerCase()+'.html';const main=r[g[4]]||r[g[5]],second=r[g[6]]||r[g[5]];a.innerHTML='<strong>'+main+'</strong>'+(second&&second!==main?'<small>'+second+'</small>':'');inner.appendChild(a)});d.querySelector('.trigger').onclick=()=>{const o=d.classList.toggle('open');d.querySelector('.arrow').textContent=o?'▲':'▼'};panel.appendChild(d)})}load();const t=document.querySelector('.toggle'),v=document.querySelector('.veil');function set(o){t.classList.toggle('open',o);v.classList.toggle('open',o);panel.classList.toggle('open',o);document.body.classList.toggle('lock',o)}t.onclick=()=>set(!panel.classList.contains('open'));v.onclick=()=>set(false);</script></body></html>
