<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Works Preview 012</title><link rel="stylesheet" href="../../../assets/css/style.css"><link rel="stylesheet" href="../../../assets/css/character-detail.css"><style>.works-preview{padding:92px 0 60px}.works-wrap{width:min(1040px,calc(100% - 32px));margin:auto}.works-card{background:#f2f5f3;padding:52px;box-shadow:0 4px 15px rgba(23,75,77,.12)}.works-heading{border-left:3px solid #2d6869;padding-left:24px;margin-bottom:40px}.works-number{font-size:14px;letter-spacing:.1em;color:#718080;margin:0 0 8px}.works-title{font:500 clamp(42px,5.5vw,68px)/1.16 "Shippori Mincho",serif;letter-spacing:.08em;color:#174b4d;margin:0}.works-subtitle{font:400 14px/1.6 "Zen Kaku Gothic New",sans-serif;color:#777;margin:7px 0 0}.works-jacket{width:min(560px,100%);aspect-ratio:1/1;margin:0 auto 42px;background:#e2e8e5;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 15px rgba(23,75,77,.12)}.works-jacket img{width:100%;height:100%;object-fit:cover}.works-jacket-placeholder{font:400 14px/1.8 "Zen Kaku Gothic New",sans-serif;color:#718080;text-align:center}.works-section{margin:0 0 30px}.works-label{font:500 25px/1.4 "Shippori Mincho",serif;letter-spacing:.08em;margin:0 0 8px}.works-links{display:grid;gap:14px}.works-divider{display:flex;align-items:center;gap:14px;margin:48px 0 42px}.works-divider:before,.works-divider:after{content:"";height:1px;background:rgba(45,104,105,.48);flex:1}.works-divider span{color:#2d6869;font-size:16px}.works-detail{min-height:120px;color:#718080;font-size:14px;line-height:1.9}@media(max-width:700px){.works-wrap{width:min(1040px,calc(100% - 20px))}.works-card{padding:32px 26px 44px}.works-heading{padding-left:17px}.works-title{font-size:clamp(42px,12vw,58px)}.works-jacket{margin-bottom:30px}.works-label{font-size:22px}.works-divider{margin:38px 0 32px}}</style></head><body><header class="site-header"><a href="../../../" class="site-title"><span class="site-title-ja">鏡外 - </span>Kagamito Official Site</a><nav></nav></header><main class="works-preview"><div class="works-wrap"><article class="works-card"><p class="preview-label">PREVIEW 012 / WORK DETAIL</p><div class="works-heading"><p class="works-number" id="work-number"></p><h1 class="works-title" id="work-title"></h1><p class="works-subtitle" id="work-subtitle"></p></div><div class="works-jacket" id="work-jacket"></div><div class="works-section" id="characters-section"><h2 class="works-label" id="characters-label"></h2><div class="works-links" id="characters-links"></div></div><div class="works-section" id="songs-section"><h2 class="works-label" id="songs-label"></h2><div class="works-links" id="songs-links"></div></div><div class="works-divider"><span>◆</span></div><section class="works-detail"><p>今後、作品に関する詳細情報をここに追加します。</p></section></article></div></main><script src="../../../assets/js/data.js"></script><script src="../../../assets/js/language.js"></script><script src="../../../assets/js/entity-common.js"></script><script src="../../../assets/js/entity-pages.js"></script><script src="../../../assets/js/menu.js"></script><script>const WORK_ID='P001';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function render(){const [works,chars,songs]=await Promise.all([loadCSV('../../../data/works.csv'),loadCSV('../../../data/characters.csv'),loadCSV('../../../data/songs.csv')]);const w=works.find(r=>(r.work_id||'').trim()===WORK_ID);if(!w)throw new Error('Work data not found.');const en=getLanguage()==='en';document.documentElement.lang=en?'en':'ja';document.getElementById('work-number').textContent=w.numbering||w.work_id;document.getElementById('work-title').textContent=en?(w.title_en||w.title_ja||''):(w.title_ja||w.title_en||'');document.getElementById('work-subtitle').textContent=en?(w.title_ja||w.subtitle_en||''):(w.title_en||'');document.getElementById('characters-label').textContent=en?'Characters':'登場キャラクター';document.getElementById('songs-label').textContent=en?'Songs':'関連楽曲';const img=w.image_path||'';document.getElementById('work-jacket').innerHTML=img?`<img src="${esc('../../../'+img.replace(/^\//,''))}" alt="${esc(w.title_ja||w.title_en||'')}">`:'<div class="works-jacket-placeholder">CD jacket image<br>will be placed here.</div>';const wc=songs.filter(s=>(s.work_id||'').trim()===(w.work_id||'').trim()&&(s.title_ja||'').trim());const ids=[...new Set(wc.flatMap(s=>String(s.theme_character_ids||'').split(/[、,;\s]+/).filter(Boolean)))];const cs=ids.map(id=>chars.find(c=>(c.character_id||'').trim()===id.trim()||(c.url_id||'').trim().toLowerCase()===id.trim().toLowerCase())).filter(Boolean);document.getElementById('characters-links').innerHTML=cs.map(c=>characterRelatedCard(`../../../characters/${characterUrl(c.url_id)}.html`,characterValue(c,'name_ja','name_en')||c.character_id,en?(c.name_ja||''):(c.name_en||''),'work')).join('');document.getElementById('songs-links').innerHTML=wc.map(s=>characterRelatedCard(`../../../songs/${characterUrl(s.url_id)}.html`,characterValue(s,'title_ja','title_en')||s.song_id,en?(s.title_ja||''):(s.title_en||''),'work')).join('');document.getElementById('characters-section').hidden=!cs.length;document.getElementById('songs-section').hidden=!wc.length}render().catch(e=>document.querySelector('.works-card').innerHTML='<p>'+esc(e.message)+'</p>');</script></body></html>
