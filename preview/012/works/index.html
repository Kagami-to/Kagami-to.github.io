<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Works Preview 012</title><link rel="stylesheet" href="../../../assets/css/style.css"><link rel="stylesheet" href="../../../assets/css/character-detail.css"><style>.works-preview{width:100%;padding:92px 0 0;background:#fafafa;color:#222;font-family:"Zen Kaku Gothic New",sans-serif}.works-wrap{width:min(1040px,calc(100% - 32px));margin:auto;padding:24px 0 60px}.works-card{background:#f2f5f3;box-shadow:0 4px 15px rgba(23,75,77,.12);padding:48px 52px 58px;position:relative;overflow:hidden}.works-card:after{content:"WORKS";position:absolute;right:-28px;top:90px;writing-mode:vertical-rl;font:400 72px/1 "Shippori Mincho",serif;letter-spacing:.08em;color:rgba(45,104,105,.045);pointer-events:none}.preview-label{position:relative;z-index:2;margin:0 0 30px;color:#718080;font-size:12px;letter-spacing:.12em}.works-heading{position:relative;z-index:2;border-left:3px solid #2d6869;padding-left:24px;margin:0;min-width:0}.works-number{margin:0 0 6px;font:400 14px/1.5 "Zen Kaku Gothic New",sans-serif;color:#555;letter-spacing:.08em}.works-fit{display:block;transform-origin:left top}.works-title{margin:0;font:500 clamp(42px,5.5vw,68px)/1.16 "Shippori Mincho",serif;letter-spacing:.08em;color:#174b4d}.works-subtitle{margin:5px 0 0;font:400 12px/1.6 "Zen Kaku Gothic New",sans-serif;color:#777;letter-spacing:.06em}.works-jacket{position:relative;z-index:2;width:min(560px,100%);aspect-ratio:1/1;margin:42px auto 42px;background:#dbe5e3;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 15px rgba(23,75,77,.12)}.works-jacket img{width:100%;height:100%;object-fit:cover}.works-jacket-placeholder{font:400 14px/1.8 "Zen Kaku Gothic New",sans-serif;color:#718080;text-align:center}.works-info{position:relative;z-index:2}.works-section{margin:0 0 30px}.works-label{margin:0 0 8px;font:500 25px/1.4 "Shippori Mincho",serif;letter-spacing:.08em;color:#222}.works-links{display:grid;gap:14px}.works-divider{position:relative;z-index:2;display:flex;align-items:center;gap:14px;margin:48px 0 42px;color:#2d6869;font:400 15px/1 "Shippori Mincho",serif;letter-spacing:.12em}.works-divider:before,.works-divider:after{content:"";height:1px;background:rgba(45,104,105,.48);flex:1}.works-divider span{font-size:16px;line-height:1}.works-detail{position:relative;z-index:2;min-height:120px;color:#718080;font-size:14px;line-height:1.9}.works-detail p{margin:0}@media(max-width:700px){.works-wrap{width:min(1040px,calc(100% - 20px));padding-top:14px}.works-card{padding:32px 26px 44px}.works-card:after{right:-18px;top:120px;font-size:46px}.works-heading{padding-left:17px}.works-title{font-size:clamp(42px,12vw,58px)}.works-jacket{margin:30px auto}.works-label{font-size:22px}.works-divider{margin:38px 0 32px}.works-detail{min-height:100px}}</style></head><body><header class="site-header"><a href="../../../" class="site-title"><span class="site-title-ja">鏡外 - </span>Kagamito Official Site</a><nav></nav></header><main class="works-preview"><div class="works-wrap"><article class="works-card" id="work-page"><p>Loading…</p></article></div></main><script src="../../../assets/js/data.js"></script><script src="../../../assets/js/language.js"></script><script src="../../../assets/js/entity-common.js"></script><script src="../../../assets/js/entity-pages.js"></script><script src="../../../assets/js/menu.js"></script><script>const WORK_ID='P001',MIN_SCALE=.5,EPS=.5;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function naturalWidth(el){const old=[el.style.width,el.style.maxWidth,el.style.whiteSpace,el.style.transform];el.style.width='max-content';el.style.maxWidth='none';el.style.whiteSpace='nowrap';el.style.transform='none';const w=el.getBoundingClientRect().width;[el.style.width,el.style.maxWidth,el.style.whiteSpace,el.style.transform]=old;return w}function lineRects(el){const range=document.createRange();range.selectNodeContents(el);const rs=[...range.getClientRects()].filter(r=>r.width>0&&r.height>0),lines=[];for(const r of rs){let line=lines.find(x=>Math.abs(x.top-r.top)<2);if(!line)lines.push(line={top:r.top,left:r.left,right:r.right,width:0});line.left=Math.min(line.left,r.left);line.right=Math.max(line.right,r.right);line.width=line.right-line.left}return lines}function fitWorkText(el){const parent=el.parentElement,available=parent?.clientWidth;if(!available)return;const natural=naturalWidth(el);if(!natural)return;const ratio=available/natural;let n=Math.max(1,Math.ceil(.5/ratio));for(;n<=10;n++){let scale=Math.min(1,Math.max(MIN_SCALE,ratio*n));for(let i=0;i<8;i++){el.style.whiteSpace='normal';el.style.maxWidth='none';el.style.width=`${100/scale}%`;el.style.transform='none';void el.offsetWidth;const lines=lineRects(el);if(lines.length>n){scale=Math.max(MIN_SCALE,scale*.94);continue}const maxLine=Math.max(...lines.map(x=>x.width),0);if(!maxLine)break;const needed=Math.min(1,available/maxLine);if(needed>=scale-EPS/available){el.style.transform=`scaleX(${scale})`;el.style.transformOrigin='left top';return}scale=Math.max(MIN_SCALE,Math.min(scale,needed*.995))}}el.style.width='100%';el.style.transform='none';el.style.whiteSpace='normal'}function fitAll(){document.querySelectorAll('.works-fit').forEach(fitWorkText)}async function render(){const [works,chars,songs]=await Promise.all([loadCSV('../../../data/works.csv'),loadCSV('../../../data/characters.csv'),loadCSV('../../../data/songs.csv')]);const w=works.find(r=>(r.work_id||'').trim()===WORK_ID),t=document.getElementById('work-page');if(!w){t.innerHTML='<p>Work data not found.</p>';return}const en=getLanguage()==='en';document.documentElement.lang=en?'en':'ja';const number=w.numbering||w.work_id,title=en?(w.title_en||w.title_ja||''):(w.title_ja||w.title_en||''),sub=en?(w.subtitle_en||''):(w.title_en||'');const wc=songs.filter(s=>(s.work_id||'').trim()===(w.work_id||'').trim()&&(s.title_ja||'').trim());const ids=[...new Set(wc.flatMap(s=>String(s.theme_character_ids||'').split(/[、,;\s]+/).filter(Boolean)))],cs=ids.map(id=>chars.find(c=>(c.character_id||'').trim()===id.trim()||(c.url_id||'').trim().toLowerCase()===id.trim().toLowerCase())).filter(Boolean);const img=w.image_path||w.jacket_image||'';const cards=cs.map(c=>characterRelatedCard(`../../../characters/${characterUrl(c.url_id)}.html`,characterValue(c,'name_ja','name_en')||c.character_id,en?(c.name_ja||''):(c.name_en||''),'work')).join(''),songCards=wc.map(s=>characterRelatedCard(`../../../songs/${characterUrl(s.url_id)}.html`,characterValue(s,'title_ja','title_en')||s.song_id,en?(s.title_ja||''):(s.title_en||''),'work')).join('');t.innerHTML=`<p class="preview-label">PREVIEW 012 / WORK DETAIL</p><div class="works-heading"><p class="works-number">${esc(number)}</p><h1 class="works-title works-fit">${esc(title)}</h1>${sub?`<p class="works-subtitle works-fit">${esc(sub)}</p>`:''}</div><div class="works-jacket">${img?`<img src="${esc('../../../'+img.replace(/^\//,''))}" alt="${esc(w.title_ja||w.title_en||'')}">`:'<div class="works-jacket-placeholder">CD jacket image<br>will be placed here.</div>'}</div><div class="works-info">${cs.length?`<section class="works-section"><h2 class="works-label">${en?'Characters':'登場キャラクター'}</h2><div class="works-links">${cards}</div></section>`:''}${wc.length?`<section class="works-section"><h2 class="works-label">${en?'Songs':'関連楽曲'}</h2><div class="works-links">${songCards}</div></section>`:''}</div><div class="works-divider"><span>◆</span></div><section class="works-detail"><p>${en?'Additional work details will be placed here.':'今後、作品に関する詳細情報をここに追加します。'}</p></section>`;fitAll()}document.documentElement.lang=getLanguage();render().catch(e=>document.getElementById('work-page').innerHTML=`<p>${esc(e.message)}</p>`);window.addEventListener('resize',fitAll);</script></body></html>
