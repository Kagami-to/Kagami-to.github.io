<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 031 - Kagamito</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#2a2030;font-family:"Zen Kaku Gothic New",sans-serif}.header{position:sticky;top:0;z-index:20;height:68px;background:#4b285f;color:#fff;display:flex;align-items:center;padding:0 18px;box-shadow:0 2px 12px #0003}.brand{font:500 18px "Shippori Mincho",serif}.menu{margin-left:auto;font-size:27px}.hero{position:relative;min-height:760px;overflow:hidden;background:linear-gradient(180deg,#4b285f 0%,#674474 30%,#a27da8 57%,#ded3df 78%,#fff 100%);display:flex;align-items:flex-start;justify-content:center;color:#fff}.shards{position:absolute;inset:0;overflow:hidden;opacity:.48}.shards i{position:absolute;display:block;background:linear-gradient(135deg,#fff8 0%,#cdb7d3 35%,#5a386a 100%);clip-path:polygon(50% 0,100% 40%,65% 100%,0 70%);filter:drop-shadow(0 4px 7px #21132f66)}.s1{width:270px;height:360px;left:4%;top:110px;transform:rotate(-17deg)}.s2{width:210px;height:300px;right:9%;top:70px;transform:rotate(21deg)}.s3{width:180px;height:250px;left:27%;top:300px;transform:rotate(14deg)}.s4{width:310px;height:270px;right:27%;top:330px;transform:rotate(-11deg)}.s5{width:150px;height:230px;left:58%;top:145px;transform:rotate(34deg)}.crack{position:absolute;width:1px;height:520px;left:50%;top:100px;background:#fff9;transform:rotate(23deg);box-shadow:110px 80px 0 -0.3px #fff5,-120px 180px 0 -0.3px #fff4}.hero-content{position:relative;z-index:2;text-align:center;padding:115px 20px 0;max-width:800px}.hero-kicker{font:500 14px "Zen Kaku Gothic New",sans-serif;letter-spacing:.3em;margin-bottom:25px;opacity:.85}.hero h1{font:600 clamp(48px,9vw,92px)/1.15 "Shippori Mincho",serif;margin:0;text-shadow:0 4px 18px #20112c66}.hero-lead{font:400 clamp(16px,2.3vw,21px)/2 "Shippori Mincho",serif;margin:30px auto 0;max-width:620px}.and-you{position:absolute;z-index:3;top:590px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 clamp(21px,3vw,31px) "Shippori Mincho",serif;letter-spacing:.08em;text-shadow:0 2px 10px #3a244555;color:#fff}.content{max-width:1050px;margin:auto;padding:70px 18px 90px}.section-head{background:#e8ddec;border:1px solid #d1bfd8;padding:30px 22px;margin-bottom:20px;text-align:center}.section-head h2{font:600 34px "Shippori Mincho",serif;color:#4b285f;margin:0}.section-head p{margin:7px 0 0;color:#786b86}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{position:relative;padding:18px 18px 18px 24px;background:#fff;border:1px solid #ddd1e1;border-left:5px solid #7b5890;box-shadow:0 4px 14px #3e254912;min-height:108px;display:flex;flex-direction:column;justify-content:center}.ep{font:400 12px/1.4 "Zen Kaku Gothic New",sans-serif;color:#786b86}.name{font:600 22px/1.35 "Shippori Mincho",serif;color:#302337;margin-top:4px}.section{margin-bottom:75px}.all{display:block;text-align:center;margin-top:14px;padding:13px;background:#e1d3e9;color:#5b3a78;text-decoration:none}.note{font-size:13px;color:#786b86;margin:0 0 15px}@media(max-width:600px){.hero{min-height:700px}.hero-content{padding-top:90px}.and-you{top:545px}.grid{grid-template-columns:1fr}.section-head h2{font-size:29px}}</style></head><body><header class="header"><div class="brand">鏡外 - Kagamito Official Site</div><div class="menu">☰</div></header><section class="hero"><div class="shards"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i><b class="crack"></b></div><div class="hero-content"><div class="hero-kicker">KAGAMITO</div><h1>鏡の向こうへ</h1><p class="hero-lead">少女は鏡の外へと誘われた。<br>まるで、最初からそう決まっていたかのように。</p></div><div class="and-you">そして、あなたも。</div></section><main class="content"><section class="section"><div class="section-head"><h2>キャラクター</h2><p>CHARACTERS</p></div><p class="note">CSVの内容から表示しています。</p><div class="grid" id="characters"></div><a class="all" href="#">すべてのキャラクターを見る →</a></section><section class="section"><div class="section-head"><h2>作品</h2><p>WORKS</p></div><div class="grid" id="works"></div><a class="all" href="#">すべての作品を見る →</a></section><section class="section"><div class="section-head"><h2>楽曲</h2><p>SONGS</p></div><div class="grid" id="songs"></div><a class="all" href="#">すべての楽曲を見る →</a></section></main><script>async function csv(path){const t=await fetch('/data/'+path+'?v=031',{cache:'no-store'}).then(r=>r.text());const rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell='';continue}cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const h=rows.shift().map(x=>x.trim());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}function card(ep,name){return `<article class="card"><div class="ep">${ep||''}</div><div class="name">${name||''}</div></article>`}async function run(){const [c,w,s]=await Promise.all([csv('characters.csv'),csv('works.csv'),csv('songs.csv')]);document.querySelector('#characters').innerHTML=c.filter(x=>x.url_id).map(x=>card(x.epithet_ja,x.name_ja)).join('');document.querySelector('#works').innerHTML=w.filter(x=>x.url_id).map(x=>card('',x.title_ja)).join('');document.querySelector('#songs').innerHTML=s.filter(x=>x.url_id).map(x=>card('',x.title_ja)).join('')}run().catch(console.error)</script></body></html>
