<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鏡外 - Preview 072</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
*{box-sizing:border-box}
html,body{margin:0;background:#f8f7f3;color:#222}
body{font-family:"Zen Kaku Gothic New",sans-serif}
.preview-label{padding:8px 14px;background:#174b4d;color:#fff;text-align:center;font-size:11px;letter-spacing:.08em}
.home-hero{background:#174b4d;overflow:hidden;--hero-size:min(74vmin,720px)}
.home-hero-inner{position:relative;overflow:hidden;background:#174b4d;padding:125px 0 125px;min-height:calc(100svh - 32px)}
.home-hero-inner::before{content:"";position:absolute;z-index:0;width:var(--hero-size);height:var(--hero-size);left:50%;top:125px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 45% 42%,rgba(255,255,255,.12),rgba(255,255,255,.055) 48%,rgba(9,41,43,.08) 74%,rgba(9,41,43,0) 75%);border:1px solid rgba(255,255,255,.09);box-shadow:0 0 90px rgba(5,30,31,.18)}
.hero-image-stage{position:absolute;z-index:1;left:50%;top:calc(125px + var(--hero-size)/2);width:min(calc(var(--hero-size)*1.1),792px);transform:translate(-50%,-50%);aspect-ratio:1/1}
.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 28px rgba(0,0,0,.18));opacity:0;transition:opacity .55s ease}
.hero-image.active{opacity:1}
.placeholder{display:flex;align-items:center;justify-content:center;font-family:"Shippori Mincho",serif;font-size:18px;letter-spacing:.12em;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.12);border-radius:50%}
.image-dots{position:absolute;z-index:3;left:50%;top:calc(125px + var(--hero-size) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.image-dot{width:7px;height:7px;padding:0;border:1px solid rgba(255,255,255,.7);border-radius:50%;background:transparent;cursor:pointer;transition:transform .2s ease,background .2s ease}
.image-dot.active{background:rgba(255,255,255,.95);transform:scale(1.25)}
.home-intro{position:relative;z-index:1;width:min(760px,84vw);margin:calc(var(--hero-size) + 125px + 3lh + 45px) auto 0;text-align:center}
.home-intro p,.home-enter p{margin:0;font-family:"Shippori Mincho",serif;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.home-intro p{font-size:18px;line-height:2.15;letter-spacing:.08em}
.home-enter{position:relative;z-index:1;width:min(900px,88vw);margin:110px auto 0;text-align:center}
.home-enter p{font-size:22px;letter-spacing:.11em}
.home-gradient{height:400px;background:linear-gradient(to bottom,#174b4d,#f8f7f3)}
.home-description{max-width:860px;margin:0 auto;padding:110px 7vw 70px;background:#f8f7f3;font-family:"Shippori Mincho",serif}
.home-description p{margin:0 0 32px;font-size:17px;line-height:2.25;letter-spacing:.06em}.home-description p:last-child{margin-bottom:0}
.home-links{max-width:900px;margin:0 auto;padding:40px 7vw 150px;background:#f8f7f3}.home-links nav{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.home-links a{display:flex;min-height:92px;align-items:center;justify-content:center;text-decoration:none;color:#f8f7f3;background:rgba(18,61,64,.92);box-shadow:0 10px 28px rgba(15,39,40,.12);font-family:"Shippori Mincho",serif;font-size:20px}
@media(max-width:700px){
 .home-hero{--hero-size:min(82vmin,720px)}
 .home-hero-inner{padding-top:105px;padding-bottom:105px}
 .home-hero-inner::before{top:105px}
 .hero-image-stage{top:calc(105px + var(--hero-size)/2);width:min(calc(var(--hero-size)*1.1),792px)}
 .image-dots{top:calc(105px + var(--hero-size) + 16px)}
 .home-intro{margin-top:calc(var(--hero-size) + 105px + 3lh + 40px)}
 .home-intro p{font-size:16px}.home-enter{margin-top:90px}.home-enter p{font-size:19px}
 .home-gradient{height:300px}.home-description{padding:80px 8vw 55px}.home-description p{font-size:16px;line-height:2.05;margin-bottom:26px}
 .home-links{padding:30px 8vw 110px}.home-links nav{grid-template-columns:1fr;gap:10px}.home-links a{min-height:72px;font-size:18px}
}
</style>
</head>
<body>
<div class="preview-label">PREVIEW 072 — TOP PAGE IMAGE INDICATOR</div>
<main class="home-hero">
 <div class="home-hero-inner">
  <div class="hero-image-stage" id="imageStage" aria-label="トップページ画像">
   <img class="hero-image active" src="/1000019929.svg" alt="鏡外ロゴ">
   <div class="hero-image placeholder" aria-hidden="true">IMAGE 02</div>
   <div class="hero-image placeholder" aria-hidden="true">IMAGE 03</div>
  </div>
  <div class="image-dots" role="tablist" aria-label="画像を選択">
   <button class="image-dot active" type="button" aria-label="画像1" aria-selected="true"></button>
   <button class="image-dot" type="button" aria-label="画像2" aria-selected="false"></button>
   <button class="image-dot" type="button" aria-label="画像3" aria-selected="false"></button>
  </div>
  <section class="home-intro"><p>少女は鏡の外へと誘われた<br>まるで最初から、<br>そう決まっていたかのように</p></section>
  <section class="home-enter"><p>そして、あなたも。</p></section>
 </div>
 <div class="home-gradient" aria-hidden="true"></div>
</main>
<section class="home-description">
 <p>鏡の向こうの世界、「鏡外」へようこそ。作者の時雨々と申します。</p>
 <p>「鏡外」は、日本神話における三種の神器の1つ、八咫鏡の向こう側にある世界を描く、時雨々による一次創作作品です。</p>
 <p>このHPはそんな「鏡外」を楽しむ為の入口です。キャラクター設定や音楽、ショートストーリーなどを通して、少しでも「鏡外」に興味を持ってくださったら幸いです。</p>
</section>
<section class="home-links"><nav><a href="#characters">Characters</a><a href="#works">Works</a><a href="#songs">Songs</a></nav></section>
<script>
const images=[...document.querySelectorAll('.hero-image')];
const dots=[...document.querySelectorAll('.image-dot')];
let current=0;
function showImage(index){
 current=(index+images.length)%images.length;
 images.forEach((image,i)=>image.classList.toggle('active',i===current));
 dots.forEach((dot,i)=>{dot.classList.toggle('active',i===current);dot.setAttribute('aria-selected',i===current?'true':'false')});
}
dots.forEach((dot,index)=>dot.addEventListener('click',()=>showImage(index)));
</script>
</body>
</html>
