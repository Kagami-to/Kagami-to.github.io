<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 053</title><style>@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');:root{--teal:#174b4d;--line:#2d6869;--bg:#f8f7f2;--ink:#263d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif}.bar{height:64px;background:var(--teal);color:#fff;display:flex;align-items:center;padding:0 18px}.brand{font:500 17px 'Shippori Mincho',serif}.hamb{margin-left:auto;font-size:25px}.page{max-width:980px;margin:auto;padding:54px 20px 100px}.heading{text-align:center;border-bottom:2px solid var(--line);padding-bottom:18px;margin-bottom:30px}.heading h1{margin:0;color:var(--teal);font:600 38px/1.3 'Shippori Mincho',serif}.heading .sub{margin-top:6px;font:400 14px 'Zen Kaku Gothic New',sans-serif;color:#657676;letter-spacing:.16em}.controls{text-align:center;margin-bottom:32px}.controls button{margin:0 4px;padding:8px 16px;border:1px solid #aac0be;background:#fff;color:var(--teal);font-family:inherit}.controls button.active{background:var(--teal);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.card{min-height:112px;background:#fff;border-left:5px solid var(--line);box-shadow:0 4px 15px rgba(23,75,77,.12);padding:22px 20px;display:flex;flex-direction:column;justify-content:center}.id{font-size:11px;color:#879393;margin-bottom:6px}.main{font:600 21px/1.45 'Shippori Mincho',serif;color:#263d3d}.secondary{margin-top:4px;font:400 13px/1.5 'Zen Kaku Gothic New',sans-serif;color:#718080}.jp .secondary:empty,.en .secondary:empty{display:none}@media(max-width:600px){.page{padding:38px 16px 70px}.heading h1{font-size:31px}.grid{grid-template-columns:1fr}.card{min-height:104px}}</style></head><body><header class="bar"><div class="brand" id="brand">鏡外 - Kagamito Official Site</div><div class="hamb">☰</div></header><main class="page"><div class="controls"><button class="active" data-lang="ja">日本語</button><button data-lang="en">English</button></div><section id="characters" class="view"><div class="heading"><h1 id="characters-title">Characters</h1><div class="sub" id="characters-sub">キャラクター</div></div><div class="grid" id="characters-grid"></div></section><section id="works" class="view" hidden><div class="heading"><h1>Works</h1><div class="sub" id="works-sub">作品</div></div><div class="grid" id="works-grid"></div></section><section id="songs" class="view" hidden><div class="heading"><h1>Songs</h1><div class="sub" id="songs-sub">楽曲</div></div><div class="grid" id="songs-grid"></div></section></main><script>const base='/kagamito/pages/';let lang='ja';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function csv(path){const r=await fetch(base+path);return parse(await r.text())}function parse(t){const rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell='';continue}cell+=c}if(cell!==''||row.length){row.push(cell);rows.push(row)}const h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}function card(main,secondary,id){return `<article class="card"><div class="id">${esc(id)}</div><div class="main">${esc(main)}</div>${secondary?`<div class="secondary">${esc(secondary)}</div>`:''}</article>`}async function render(){const [cs,ws,ss]=await Promise.all([csv('characters.csv'),csv('works.csv'),csv('songs.csv')]);document.getElementById('characters-grid').innerHTML=cs.map(x=>card(x.epithet_ja,x.name_ja,x.character_id)).join('');document.getElementById('works-grid').innerHTML=ws.map(x=>lang==='ja'?card(x.title_ja,x.title_en,x.work_id):card(x.title_en,x.subtitle_en,x.work_id)).join('');document.getElementById('songs-grid').innerHTML=ss.filter(x=>x.title_ja||x.title_en).map(x=>lang==='ja'?card(x.title_ja,'',x.song_id):card(x.title_en,x.title_ja,x.song_id)).join('')}function update(){document.getElementById('works-sub').textContent=lang==='ja'?'作品':'';document.getElementById('songs-sub').textContent=lang==='ja'?'楽曲':'';document.getElementById('characters-sub').textContent=lang==='ja'?'キャラクター':'';render()}document.querySelectorAll('.controls button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll('.controls button').forEach(x=>x.classList.toggle('active',x===b));update()});document.getElementById('characters').onclick=()=>{};render();</script></body></html>
