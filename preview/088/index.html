<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Preview 088</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@300;400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
*{box-sizing:border-box}html{background:#fafafa}body{margin:0;background:#fafafa;color:#222;font-family:'Zen Kaku Gothic New',sans-serif}.preview{background:#234f50;color:#fff;text-align:center;padding:9px 14px;font-size:11px}.wrap{width:min(1040px,calc(100% - 32px));margin:auto;padding:24px 0 60px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}.back{display:inline-block;color:#2d6869;text-decoration:none;font:400 13px 'Shippori Mincho',serif}.selector{border:1px solid rgba(45,104,105,.35);background:#f2f5f3;color:#2d6869;padding:7px 11px;font:400 12px 'Zen Kaku Gothic New',sans-serif;max-width:260px}.card{background:#f2f5f3;box-shadow:0 4px 15px rgba(23,75,77,.12);padding:48px 52px 58px;position:relative;overflow:hidden}.card:after{content:'CHARACTERS';position:absolute;right:-28px;top:90px;writing-mode:vertical-rl;font:400 72px 'Shippori Mincho',serif;letter-spacing:.08em;color:rgba(45,104,105,.045);pointer-events:none}.hero{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:58px;align-items:stretch}.hero-info{padding:10px 0 0;display:flex;flex-direction:column;min-width:0}.identity-group{min-width:0;border-left:3px solid #2d6869;padding-left:24px}.identity-content{min-width:0;padding-right:17px}.fit-box{position:relative;width:100%;min-width:0}.fit-text{display:block;transform-origin:left center;will-change:transform}.epithet{margin:0 0 6px;font:400 14px/1.5 'Zen Kaku Gothic New',sans-serif;color:#555;letter-spacing:.08em}.name{margin:0;font:500 clamp(42px,5.5vw,68px)/1.16 'Shippori Mincho',serif;letter-spacing:.08em}.secondary-name{margin:5px 0 0;font:400 12px/1.6 'Zen Kaku Gothic New',sans-serif;color:#777;letter-spacing:.06em}.reading{margin:7px 0 0;font:400 11px/1.5 'Zen Kaku Gothic New',sans-serif;color:#777;letter-spacing:.13em}.ability-wrap{margin:28px 0 0}.ability{margin:0;font:400 24px/1.7 'Shippori Mincho',serif;letter-spacing:.06em}.song-section{margin-top:auto;padding-top:28px}.song-heading{margin:0 0 11px;font:500 22px/1.4 'Shippori Mincho',serif;letter-spacing:.08em}.related-list{display:grid;gap:10px}.song-card,.work-card{display:block;background:#fff;border-left:5px solid #2d6869;box-shadow:0 4px 15px rgba(23,75,77,.12);padding:17px 20px;color:#263d3d;text-decoration:none;min-height:76px}.song-title,.work-title{font:600 20px/1.45 'Shippori Mincho',serif}.song-subtitle,.work-subtitle{margin-top:4px;font:400 12px/1.55 'Zen Kaku Gothic New',sans-serif;color:#6b7472}.card-arrow{float:right;margin-left:15px;color:#2d6869;font:400 15px/1 'Zen Kaku Gothic New',sans-serif}.portrait{height:100%;min-height:490px;background:#e8ecea;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#999;font:400 10px/1.5 'Zen Kaku Gothic New',sans-serif;letter-spacing:.12em;text-align:center}.portrait img{width:100%;height:100%;object-fit:cover;display:none}.portrait img.active{display:block}.portrait-label{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px;background:rgba(232,236,234,.82)}.portrait.has-image .portrait-label{display:none}.portrait-dots{position:absolute;z-index:3;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:13px}.portrait-dots[hidden]{display:none}.portrait-dot{width:18px;height:18px;border-radius:50%;border:2px solid #2d6869;background:rgba(255,255,255,.8);padding:0;cursor:pointer}.portrait-dot.active{background:#2d6869}.section{position:relative;z-index:1;margin-top:54px;border-top:1px solid #d9dfdc;padding-top:38px}.heading{margin:0 0 15px;font:500 25px/1.4 'Shippori Mincho',serif;letter-spacing:.08em}.profile{font:400 15px/2.15 'Zen Kaku Gothic New',sans-serif;max-width:760px}.lang{position:fixed;right:18px;top:18px;z-index:20;border:1px solid rgba(45,104,105,.35);background:#f2f5f3;color:#2d6869;padding:7px 11px;font:400 12px 'Shippori Mincho',serif;cursor:pointer}.pager{position:fixed;top:50%;transform:translateY(-50%);z-index:30;cursor:pointer;width:58px;height:82px;border:0;background:rgba(45,104,105,.58);color:#fff;font:400 34px/1 'Shippori Mincho',serif}.pager.prev{left:-22px;border-radius:0 8px 8px 0;padding-left:20px}.pager.next{right:-22px;border-radius:8px 0 0 8px;padding-right:20px}@media(max-width:760px){.wrap{width:calc(100% - 20px);padding-top:14px}.toolbar{flex-wrap:wrap}.card{padding:32px 26px 44px}.card:after{font-size:46px;right:-18px;top:90px}.hero{display:flex;flex-direction:column;gap:0}.hero-info{display:contents}.identity-group{order:1;width:calc(100% + 20px);padding:0 0 0 17px;border-left:3px solid #2d6869}.identity-content{padding:0}.portrait{order:2;min-height:0;aspect-ratio:4/5;width:min(100%,340px);margin:30px auto 0}.ability-wrap{order:3;margin:28px 0 0;padding:0}.song-section{order:4;margin-top:20px;padding:0}.section{margin-top:42px;padding-top:32px}.heading{font-size:22px}.profile{font-size:14px;line-height:2}.song-card,.work-card{padding:16px 18px}.song-title,.work-title{font-size:18px}.pager{width:50px;height:68px;font-size:28px}.pager.prev{left:-18px;padding-left:16px}.pager.next{right:-18px;padding-right:16px}.lang{right:12px;top:12px}.portrait-dots{bottom:12px;gap:10px}.portrait-dot{width:20px;height:20px}.selector{max-width:100%}}
</style>
</head>
<body>
<button class="lang" id="langBtn">English</button><button class="pager prev" id="prev">&lt;</button><button class="pager next" id="next">&gt;</button>
<div class="preview" id="previewLabel">CHARACTER DETAIL 088 — 日本語プレビュー</div>
<main class="wrap"><div class="toolbar"><a class="back" id="back" href="../../characters/">← Characters</a><select class="selector" id="selector"></select></div>
<article class="card"><section class="hero"><div class="hero-info"><div class="identity-group"><div class="identity-content"><div class="fit-box"><p class="epithet fit-text" id="epithet"></p></div><div class="fit-box"><h1 class="name fit-text" id="name"></h1></div><div class="fit-box"><p class="secondary-name fit-text" id="secondary"></p></div><div class="fit-box"><p class="reading fit-text" id="reading"></p></div></div></div><div class="ability-wrap"><div class="fit-box"><p class="ability fit-text" id="ability"></p></div></div><div class="song-section" id="songSection"><h2 class="song-heading" id="songHeading"></h2><div id="songs" class="related-list"></div></div></div><div class="portrait" id="portrait"><div class="portrait-label" id="portraitLabel">画像</div><div class="portrait-dots" id="portraitDots"></div></div></section>
<section class="section" id="positionSection"><h2 class="heading" id="positionHeading"></h2><div class="profile" id="position"></div></section><section class="section" id="profileSection"><h2 class="heading" id="profileHeading"></h2><div class="profile" id="profile"></div></section><section class="section" id="worksSection"><h2 class="heading" id="worksHeading"></h2><div id="works" class="related-list"></div></section></article></main>
<script>
const BASE='../../kagamito/pages/';let characters=[],songs=[],works=[],index=0,english=false,currentImages=[];const $=id=>document.getElementById(id);
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else quoted=false}else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field);rows.push(row);row=[];field=''}else if(c!=='\r')field+=c}if(field.length||row.length){row.push(field);rows.push(row)}const headers=(rows.shift()||[]).map(v=>v.trim());return rows.filter(r=>r.some(v=>v.trim()!=='')).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??'').trim()])))}
async function loadCSV(file){const r=await fetch(BASE+file,{cache:'no-store'});if(!r.ok)throw Error(file+' の読み込みに失敗しました');return parseCSV(await r.text())}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ids(v){return String(v||'').split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean)}function value(r,ja,en){return english?(r[en]||''):(r[ja]||'')}function urlId(v){return String(v||'').toLowerCase().replace(/\./g,'-')}
function fitText(el){const box=el.parentElement;el.style.transform='none';el.style.width='auto';el.style.whiteSpace='nowrap';const p=el.cloneNode(true);p.style.cssText='position:absolute;left:-100000px;visibility:hidden;white-space:nowrap;width:max-content;transform:none';document.body.appendChild(p);const natural=p.getBoundingClientRect().width;p.remove();const available=box.clientWidth;if(!available||natural<=available)return;const ratio=available/natural;if(ratio>=.5)el.style.transform='scaleX('+ratio+')';else{el.style.width='100%';el.style.whiteSpace='normal'}}function fitAll(){document.querySelectorAll('.fit-text').forEach(fitText)}
function songCard(s){const main=english?(s.title_en||s.title_ja||s.song_id):(s.title_ja||s.title_en||s.song_id);const sub=english?(s.title_ja||''):(s.title_en||'');return `<a class="song-card" href="../../songs/${esc(urlId(s.url_id||s.song_id))}.html"><span class="card-arrow">→</span><div class="song-title">${esc(main)}</div>${sub?`<div class="song-subtitle">${esc(sub)}</div>`:''}</a>`}function workCard(w){const main=english?(w.title_en||w.title_ja||w.work_id):(w.title_ja||w.title_en||w.work_id);const sub=english?(w.subtitle_en||''):(w.title_en||'');return `<a class="work-card" href="../../works/${esc(urlId(w.url_id||w.work_id))}.html"><span class="card-arrow">→</span><div class="work-title">${esc(main)}</div>${sub?`<div class="work-subtitle">${esc(sub)}</div>`:''}</a>`}
function renderImages(c){const p=$('portrait'),d=$('portraitDots');p.querySelectorAll('img').forEach(x=>x.remove());d.innerHTML='';currentImages=String(c.appearance_image||'').split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean);if(!currentImages.length){p.classList.remove('has-image');d.hidden=true;$('portraitLabel').textContent=english?'IMAGE':'画像';return}p.classList.add('has-image');currentImages.forEach((path,i)=>{const img=document.createElement('img');img.src=path.startsWith('/')||/^https?:/i.test(path)?path:'../../'+path;img.alt=english?(c.name_en||c.name_ja):(c.name_ja||c.name_en);img.className=i===0?'active':'';p.insertBefore(img,d)});d.hidden=currentImages.length<=1;if(currentImages.length>1)currentImages.forEach((_,i)=>{const b=document.createElement('button');b.className='portrait-dot'+(i?'':' active');b.type='button';b.setAttribute('aria-label',(english?'Image ':'画像 ')+(i+1));b.onclick=()=>{p.querySelectorAll('img').forEach((x,n)=>x.classList.toggle('active',n===i));d.querySelectorAll('.portrait-dot').forEach((x,n)=>x.classList.toggle('active',n===i))};d.appendChild(b)})}
function section(id,heading,body){const s=$(id);s.style.display=body?'':'none';if(body){$(heading).textContent=english?$(heading).dataset.en:$(heading).dataset.ja;$(id.replace('Section','')).innerHTML=body}}
function render(){const c=characters[index];if(!c)return;document.documentElement.lang=english?'en':'ja';$('langBtn').textContent=english?'日本語':'English';$('back').textContent=english?'← Characters':'← キャラクター';$('previewLabel').textContent=english?'CHARACTER DETAIL 088 — English Preview':'CHARACTER DETAIL 088 — 日本語プレビュー';$('epithet').textContent=value(c,'epithet_ja','epithet_en');$('name').textContent=english?(c.name_en||''):(c.name_ja||'');$('secondary').textContent=english?(c.name_ja||''):(c.name_en||'');$('reading').textContent=english?'':(c.reading_ja||'');const ability=value(c,'ability_ja','ability_en');$('ability').textContent=ability;$('ability').parentElement.parentElement.style.display=ability?'':'none';$('songHeading').textContent=english?'Theme Song':'テーマ曲';const theme=ids(c.theme_song_ids).map(id=>songs.find(s=>s.song_id===id)).filter(Boolean);$('songSection').style.display=theme.length?'':'none';$('songs').innerHTML=theme.map(songCard).join('');
const pos=value(c,'position_ja','position_en');$('positionSection').style.display=pos?'':'none';$('positionHeading').textContent=english?'Position':'立場';$('position').textContent=pos||'';const prof=value(c,'profile_ja','profile_en');$('profileSection').style.display=prof?'':'none';$('profileHeading').textContent=english?'Profile':'プロフィール';$('profile').textContent=prof||'';const ws=ids(c.appearance_work_ids).map(id=>works.find(w=>w.work_id===id)).filter(Boolean);$('worksSection').style.display=ws.length?'':'none';$('worksHeading').textContent=english?'Works':'登場作品';$('works').innerHTML=ws.map(workCard).join('');renderImages(c);fitAll();$('selector').value=c.character_id;}
function populate(){const s=$('selector');s.innerHTML=characters.map((c,i)=>`<option value="${esc(c.character_id)}">${esc(c.character_id)} — ${esc(c.name_ja)}</option>`).join('');s.onchange=()=>{index=characters.findIndex(c=>c.character_id===s.value);render()}}
$('langBtn').onclick=()=>{english=!english;render()};$('prev').onclick=()=>{index=(index-1+characters.length)%characters.length;render()};$('next').onclick=()=>{index=(index+1)%characters.length;render()};
(async()=>{try{[characters,songs,works]=await Promise.all([loadCSV('characters.csv'),loadCSV('songs.csv'),loadCSV('works.csv')]);populate();render()}catch(e){document.querySelector('.card').innerHTML='<div class="error">'+esc(e.message)+'</div>'}})();
window.addEventListener('resize',fitAll);
</script></body></html>
