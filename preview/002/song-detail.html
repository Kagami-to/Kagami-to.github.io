<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song Preview 002 - Kagamito Official</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/character-detail.css">
  <style>
    .song-preview-page{width:100%;padding:92px 0 0;background:#fafafa;color:#222;font-family:"Zen Kaku Gothic New",sans-serif}
    .song-preview-wrap{width:min(1040px,calc(100% - 32px));margin:auto;padding:24px 0 60px}
    .song-preview-card{background:#f2f5f3;box-shadow:0 4px 15px rgba(23,75,77,.12);padding:48px 52px 58px;position:relative;overflow:hidden}
    .song-preview-card:after{content:"SONGS";position:absolute;right:-28px;top:90px;writing-mode:vertical-rl;font:400 72px/1 "Shippori Mincho",serif;letter-spacing:.08em;color:rgba(45,104,105,.045);pointer-events:none}
    .preview-label{position:relative;z-index:2;margin:0 0 30px;color:#718080;font-size:12px;letter-spacing:.12em}
    .song-title{position:relative;z-index:2;margin:0;padding-left:22px;border-left:5px solid #2d6869;font-family:"Shippori Mincho",serif;font-size:clamp(32px,5vw,58px);font-weight:600;line-height:1.25;color:#174b4d}
    .song-title-sub{position:relative;z-index:2;margin:12px 0 0 27px;color:#718080;font-size:14px;line-height:1.6}
    .song-layout{position:relative;z-index:2;display:grid;grid-template-columns:2fr 1fr;gap:38px;margin-top:42px;align-items:start}
    .song-info{min-width:0}
    .song-info-section{margin:0 0 28px}
    .song-info-label{margin:0 0 8px;font-family:"Shippori Mincho",serif;font-size:20px;font-weight:600;color:#174b4d}
    .song-scene{margin:0;line-height:1.9}
    .song-link-stack{display:grid;gap:14px}
    .song-link-card{display:block;text-decoration:none}
    .song-link-card .character-092-card-title,.song-link-card .character-092-card-subtitle{position:relative}
    .song-video{min-width:0}
    .song-video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#dbe5e3;box-shadow:0 4px 15px rgba(23,75,77,.12);overflow:hidden}
    .song-video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .song-video-note{margin:9px 0 0;color:#718080;font-size:11px;line-height:1.5}
    .song-divider{display:flex;align-items:center;gap:14px;margin:48px 0 42px;color:#2d6869}
    .song-divider:before,.song-divider:after{content:"";height:1px;background:#bfd1cf;flex:1}
    .song-divider span{font-size:18px;line-height:1}
    .song-detail-placeholder{position:relative;z-index:2;min-height:120px;color:#718080;font-size:14px;line-height:1.9}
    .old-youtube{position:relative;z-index:2;margin-top:42px;padding-top:24px;border-top:1px solid #bfd1cf;color:#718080;font-size:12px;line-height:1.8}
    .old-youtube a{color:#315f61}
    @media (max-width:700px){
      .song-preview-wrap{width:min(1040px,calc(100% - 20px));padding-top:14px}
      .song-preview-card{padding:32px 24px 44px}
      .song-preview-card:after{right:-22px;top:120px;font-size:54px}
      .song-title{padding-left:16px;border-left-width:4px;font-size:clamp(29px,9vw,44px)}
      .song-title-sub{margin-left:20px;font-size:12px}
      .song-layout{display:flex;flex-direction:column;gap:0;margin-top:34px}
      .song-video{order:1;width:100%}
      .song-info{order:2;width:100%;padding-top:30px}
      .song-info-section{margin-bottom:26px}
      .song-info-label{font-size:19px}
      .song-divider{margin:38px 0 32px}
      .song-detail-placeholder{min-height:100px}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="../../" class="site-title"><span class="site-title-ja">鏡外 - </span>Kagamito Official Site</a>
    <nav></nav>
  </header>
  <main class="song-preview-page">
    <div class="song-preview-wrap">
      <article class="song-preview-card" id="song-page">
        <p>Loading…</p>
      </article>
    </div>
  </main>

  <script src="../../assets/js/data.js"></script>
  <script src="../../assets/js/language.js"></script>
  <script src="../../assets/js/entity-pages.js"></script>
  <script src="../../assets/js/character-pages.js"></script>
  <script>
    const PREVIEW_SONG_ID='M003';
    function songEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function songValue(row,ja,en){return getLanguage()==='en'?(row[en]||row[ja]||''):(row[ja]||row[en]||'')}
    function youtubeEmbedUrl(url){
      try{
        const u=new URL(url);
        let id='';
        if(u.hostname==='youtu.be') id=u.pathname.slice(1);
        else if(u.hostname.includes('youtube.com')) id=u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop();
        if(!id)return '';
        return `https://www.youtube.com/embed/${encodeURIComponent(id)}`;
      }catch(e){return ''}
    }
    async function renderSong(){
      const [songs,chars,works]=await Promise.all([
        loadCSV('../../data/songs.csv'),
        loadCSV('../../data/characters.csv'),
        loadCSV('../../data/works.csv')
      ]);
      const song=songs.find(r=>(r.song_id||'').trim()===PREVIEW_SONG_ID);
      const target=document.getElementById('song-page');
      if(!song){target.innerHTML='<p>Song data not found.</p>';return}
      const en=getLanguage()==='en';
      const title=songValue(song,'title_ja','title_en');
      const japaneseTitle=en?(song.title_ja||''):'';
      const scene=songValue(song,'scene_ja','scene_en');
      const work=works.find(r=>(r.work_id||'').trim()===(song.work_id||'').trim());
      const charIds=String(song.theme_character_ids||'').split(/[、,;\s]+/).filter(Boolean);
      const themeChars=charIds.map(id=>chars.find(r=>(r.character_id||'').trim()===id.trim()||(r.url_id||'').trim().toLowerCase()===id.trim().toLowerCase())).filter(Boolean);
      const video=youtubeEmbedUrl(song.youtube_url);
      const charCards=themeChars.map(c=>{
        const main=characterValue(c,'name_ja','name_en')||c.character_id;
        const sub=en?(c.name_ja||''):(c.name_en||'');
        return characterRelatedCard(`/characters/${characterUrl(c.url_id)}.html`,main,sub,'work');
      }).join('');
      const workCard=work?characterRelatedCard(`/works/${characterUrl(work.url_id)}.html`,characterValue(work,'title_ja','title_en')||work.work_id,en?(work.title_ja||''):(work.title_en||''),'work'):'';
      target.innerHTML=`
        <p class="preview-label">PREVIEW 002 / SONG DETAIL</p>
        <h1 class="song-title">${songEscape(song.numbering||song.song_id)}<br>${songEscape(title)}</h1>
        ${japaneseTitle?`<p class="song-title-sub">${songEscape(japaneseTitle)}</p>`:''}
        <div class="song-layout">
          <div class="song-info">
            <section class="song-info-section"><h2 class="song-info-label">${en?'Scene':'使用場面'}</h2><p class="song-scene">${songEscape(scene)}</p></section>
            ${themeChars.length?`<section class="song-info-section"><h2 class="song-info-label">${en?'Theme Character':'テーマキャラクター'}</h2><div class="song-link-stack">${charCards}</div></section>`:''}
            ${work?`<section class="song-info-section"><h2 class="song-info-label">${en?'Work':'作品'}</h2><div class="song-link-stack">${workCard}</div></section>`:''}
          </div>
          <div class="song-video">
            ${video?`<div class="song-video-frame"><iframe src="${songEscape(video)}" title="${songEscape(title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`:'<p>Current YouTube video is not available.</p>'}
          </div>
        </div>
        <div class="song-divider" aria-hidden="true"><span>◆</span></div>
        <section class="song-detail-placeholder"><p>${en?'Additional song details will be placed here.':'今後、楽曲に関する詳細情報をここに追加します。'}</p></section>
        ${song.old_youtube_url?`<aside class="old-youtube"><strong>${en?'Older YouTube':'旧YouTube'}</strong><br>${en?'Previous video: ':'以前の動画：'}<a href="${songEscape(song.old_youtube_url)}" target="_blank" rel="noopener">${songEscape(song.old_youtube_url)}</a></aside>`:''}
      `;
    }
    document.documentElement.lang=getLanguage();
    renderSong().catch(e=>{document.getElementById('song-page').innerHTML=`<p>${songEscape(e.message)}</p>`});
  </script>
  <script src="../../assets/js/menu.js"></script>
</body>
</html>
