<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 015 - Menu</title><style>*{box-sizing:border-box}body{margin:0;background:#17121b;color:#eee;font-family:"Noto Sans JP",system-ui,sans-serif}body.lock{overflow:hidden}.header{position:fixed;z-index:30;top:0;left:0;right:0;height:68px;background:#2b1238;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #6d3b7d}.brand{color:#fff;text-decoration:none;font-weight:800}.toggle{width:52px;height:52px;border:0;background:none}.hamb{display:block;width:25px;margin:auto}.hamb i{display:block;height:2px;background:#fff;margin:6px 0;transition:.3s}.toggle.open .hamb i:nth-child(1){transform:translateY(8px) rotate(45deg)}.toggle.open .hamb i:nth-child(2){opacity:0}.toggle.open .hamb i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}.veil{position:fixed;z-index:20;top:68px;left:0;right:0;bottom:0;background:#08050caa;opacity:0;pointer-events:none;transition:.3s}.veil.open{opacity:1;pointer-events:auto}.panel{position:fixed;z-index:25;top:68px;right:0;bottom:0;width:min(90vw,410px);overflow:auto;padding:18px 16px 32px;background:#211827;transform:translateX(100%);transition:.35s cubic-bezier(.2,.8,.2,1);box-shadow:-18px 0 40px #0007}.panel.open{transform:none}.group{margin-bottom:8px}.trigger{width:100%;min-height:84px;padding:13px 16px;border:1px solid #4d3557;background:#2d2034;color:#fff;display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer}.trigger:hover{background:#382641}.main{font-size:23px;font-weight:800}.sub{display:block;margin-top:4px;font-size:12px;color:#b7a7bd}.arrow{color:#c69bd5}.sublist{display:grid;grid-template-rows:0fr;transition:.3s;background:#19131e}.group.open .sublist{grid-template-rows:1fr}.inner{min-height:0;overflow:hidden}.all,.person{display:block;text-decoration:none;color:#eee;border-top:1px solid #34283a;padding:12px 17px}.all{color:#d7a8e4;font-weight:750;background:#281b30}.person strong{display:block;font-size:15px}.person small{display:block;margin-top:3px;color:#a995ae;font-size:12px}.person:hover,.all:hover{background:#302039}.content{padding:120px 24px;max-width:900px;margin:auto}.hero{min-height:900px;border:1px solid #3d2946;padding:28px;background:radial-gradient(circle at 80% 10%,#4a245855,transparent 40%),#1c151f}.label{color:#bf8dcd;font-size:11px;letter-spacing:.15em}.hero h1{font-size:44px;margin-top:60px}</style></head><body><header class="header"><a class="brand" href="#">鏡外 - Kagamito Official Site</a><button class="toggle" aria-label="menu"><span class="hamb"><i></i><i></i><i></i></span></button></header><div class="veil"></div><aside class="panel"></aside><main class="content"><section class="hero"><p class="label">PREVIEW 015 · DARK PURPLE</p><h1>Characters</h1><p>紫〜赤紫を強く出したダークテーマ案。メニューの階層と二つ名をはっきり見せます。</p><div style="height:650px"></div></section></main><script>const panel=document.querySelector('.panel');const base='../';function parseCSV(t){let A=[],r=[],c='',q=0;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===','&&!q){r.push(c);c='';continue}if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);if(r.some(Boolean))A.push(r);r=[];c='';continue}c+=x}if(c||r.length){r.push(c);A.push(r)}let h=A.shift();return A.map(z=>Object.fromEntries(h.map((k,i)=>[k,z[i]||''])))}async function load(){let [c,w,s]=await Promise.all(['characters','works','songs'].map(x=>fetch(base+'data/'+x+'.csv').then(r=>r.text()).then(parseCSV)));[['Characters','キャラクター','すべてのキャラクターを見る',c,'name_ja','name_en','epithet_ja','characters'],['Works','作品','すべての作品を見る',w,'title_ja','title_en','subtitle_en','works'],['Songs','楽曲','楽曲','',s,'title_ja','title_en','','songs']].forEach(g=>{let d=document.createElement('section');d.className='group';d.innerHTML='<button class="trigger"><span><span class="main">'+g[0]+'</span><span class="sub">'+g[1]+'</span></span><span class="arrow">▼</span></button><div class="sublist"><div class="inner"><a class="all" href="'+g[7]+'/index.html">'+g[2]+'　→</a></div></div>';let inner=d.querySelector('.inner');g[3].filter(r=>r.url_id&&(r[g[4]]||r[g[5]])).forEach(r=>{let a=document.createElement('a');a.className='person';a.href=base+g[7]+'/'+r.url_id+'.html';let m=r[g[4]]||r[g[5]],s=r[g[6]]||r[g[5]];a.innerHTML='<strong>'+m+'</strong>'+(s&&s!==m?'<small>'+s+'</small>':'');inner.appendChild(a)});d.querySelector('.trigger').onclick=()=>{let o=d.classList.toggle('open');d.querySelector('.arrow').textContent=o?'▲':'▼'};panel.appendChild(d)})}load();let t=document.querySelector('.toggle'),v=document.querySelector('.veil');function set(o){t.classList.toggle('open',o);v.classList.toggle('open',o);panel.classList.toggle('open',o);document.body.classList.toggle('lock',o)}t.onclick=()=>set(!panel.classList.contains('open'));v.onclick=()=>set(false);</script></body></html>
