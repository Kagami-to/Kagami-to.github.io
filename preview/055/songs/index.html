<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 055 - Songs</title><style>body{margin:0;background:#f8f7f2;color:#263d3d;font-family:system-ui,sans-serif}.page{max-width:980px;margin:auto;padding:48px 20px}.heading{text-align:center;border-bottom:2px solid #2d6869;padding-bottom:18px;margin-bottom:30px}.heading h1{margin:0;color:#174b4d;font:600 38px serif}.sub{margin-top:6px;color:#657676;letter-spacing:.16em}.lang{text-align:right;margin-bottom:22px}button{padding:7px 13px;border:1px solid #aac0be;background:white;color:#174b4d}button.active{background:#174b4d;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.card{min-height:112px;background:white;border-left:5px solid #2d6869;box-shadow:0 4px 15px #174b4d20;padding:22px;display:flex;flex-direction:column;justify-content:center}.main{font:600 21px/1.45 serif}.secondary{margin-top:5px;color:#718080;font-size:13px}</style></head><body><main class="page"><div class="lang"><button class="active" data-l="ja">日本語</button><button data-l="en">English</button></div><div class="heading"><h1>Songs</h1><div class="sub" id="sub">楽曲</div></div><div class="grid" id="grid"></div></main><script>let l='ja';function p(t){const a=t.trim().split(/\r?\n/),h=a.shift().split(','),o=[];for(const s of a){const r=s.split(',');o.push(Object.fromEntries(h.map((k,i)=>[k,r[i]||''])))}return o}async function load(){const t=await(await fetch('/kagamito/pages/songs.csv')).text(),d=p(t);grid.innerHTML=d.filter(x=>x.title_ja||x.title_en).map(x=>`<article class="card"><div class="main">${l==='ja'?x.title_ja:x.title_en}</div>${l==='en'?`<div class="secondary">${x.title_ja}</div>`:''}</article>`).join('');sub.textContent=l==='ja'?'楽曲':''}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{l=b.dataset.l;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));load()});load()</script></body></html>
