<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview 014 - Menu</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2f6;color:#211827;font-family:"Noto Serif JP","Yu Mincho",serif}body.lock{overflow:hidden}.header{position:fixed;z-index:30;inset:0 0 auto;height:70px;background:#392044;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{color:#fff;text-decoration:none;font-weight:700;letter-spacing:.02em}.toggle{width:52px;height:52px;border:0;background:none;color:#fff}.hamb{display:block;width:23px;margin:auto}.hamb i{display:block;height:1.5px;background:#fff;margin:7px 0;transition:.3s}.toggle.open .hamb i:nth-child(1){transform:translateY(8.5px) rotate(45deg)}.toggle.open .hamb i:nth-child(2){opacity:0}.toggle.open .hamb i:nth-child(3){transform:translateY(-8.5px) rotate(-45deg)}.veil{position:fixed;z-index:20;top:70px;inset-inline:0;bottom:0;background:#180d2099;opacity:0;pointer-events:none;transition:.35s}.veil.open{opacity:1;pointer-events:auto}.panel{position:fixed;z-index:25;top:70px;right:0;bottom:0;width:min(92vw,430px);overflow:auto;background:#fbf9fc;transform:translateX(100%);transition:.38s cubic-bezier(.18,.82,.2,1);padding:28px 20px 38px}.panel.open{transform:none}.group{border-top:1px solid #d9d0dc}.group:last-child{border-bottom:1px solid #d9d0dc}.trigger{width:100%;min-height:88px;padding:13px 8px;border:0;background:transparent;display:flex;justify-content:space-between;align-items:center;text-align:left;font-family:inherit;color:#2b1d30}.main{font-size:25px;font-weight:700;letter-spacing:.02em}.sub{display:block;font-size:12px;letter-spacing:.08em;color:#82758a;margin-top:4px}.arrow{font-family:system-ui;font-size:16px;color:#684376}.sublist{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s}.group.open .sublist{grid-template-rows:1fr}.inner{min-height:0;overflow:hidden;padding-bottom:0}.all,.person{display:block;text-decoration:none;color:#33263a;border-top:1px solid #ebe6ed;padding:13px 8px}.all{color:#654070;font-weight:700;font-size:14px}.person strong{display:block;font-size:16px;font-weight:600}.person small{display:block;font-size:11px;color:#8a7b90;margin-top:3px}.person:hover,.all:hover{background:#f1ebf3}.content{padding:120px 26px;max-width:920px;margin:auto}.paper{min-height:900px;background:#fff;padding:30px;box-shadow:0 1px 10px #2c183310}.paper p{line-height:2}.label{font-family:system-ui;color:#72507c;font-size:12px;letter-spacing:.12em}</style></head><body><header class="header"><a class="brand" href="#">鏡外 - Kagamito Official Site</a><button class="toggle" aria-label="menu"><span class="hamb"><i></i><i></i><i></i></span></button></header><div class="veil"></div><aside class="panel"></aside><main class="content"><article class="paper"><p class="label">PREVIEW 014 · EDITORIAL SERIF</p><h1>Characters</h1><p>日本語の文字に明朝系フォントを使い、作品資料・文芸サイトのような落ち着いた雰囲気を狙った案です。</p><div style="height:650px"></div></article></main><script>const panel=document.querySelector('.panel');const base='../';function parseCSV(t){const a=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===','&&!q){r.push(c);c='';continue}if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);if(r.some(Boolean))a.push(r);r=[];c='';continue}c+=x}if(c||r.length){r.push(c);a.push(r)}let h=a.shift();return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}async function load(){let [c,w,s]=await Promise.all(['characters','works','songs'].map(x=>fetch(base+'data/'+x+'.csv').then(r=>r.text()).then(parseCSV)));[['Characters','キャラクター','すべてのキャラクターを見る',c,'name_ja','name_en','epithet_ja','characters'],['Works','作品','すべての作品を見る',w,'title_ja','title_en','subtitle_en','works'],['Songs','楽曲','すべての楽曲を見る',s,'title_ja','title_en','','songs']].forEach(g=>{let d=document.createElement('section');d.className='group';d.innerHTML='<button class="trigger"><span><span class="main">'+g[0]+'</span><span class="sub">'+g[1]+'</span></span><span class="arrow">▼</span></button><div class="sublist"><div class="inner"><a class="all" href="'+g[7]+'/index.html">'+g[2]+'　→</a></div></div>';let inner=d.querySelector('.inner');g[3].filter(r=>r.url_id&&(r[g[4]]||r[g[5]])).forEach(r=>{let a=document.createElement('a');a.className='person';a.href=base+g[7]+'/'+r.url_id+'.html';let m=r[g[4]]||r[g[5]],s=r[g[6]]||r[g[5]];a.innerHTML='<strong>'+m+'</strong>'+(s&&s!==m?'<small>'+s+'</small>':'');inner.appendChild(a)});d.querySelector('.trigger').onclick=()=>{let o=d.classList.toggle('open');d.querySelector('.arrow').textContent=o?'▲':'▼'};panel.appendChild(d)})}load();let t=document.querySelector('.toggle'),v=document.querySelector('.veil');function set(o){t.classList.toggle('open',o);v.classList.toggle('open',o);panel.classList.toggle('open',o);document.body.classList.toggle('lock',o)}t.onclick=()=>set(!panel.classList.contains('open'));v.onclick=()=>set(false);</script></body></html>
