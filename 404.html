<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character - Kagamito Official</title><link rel="stylesheet" href="/assets/css/style.css"></head><body><header class="site-header"><a href="/" class="site-title">Kagamito Official</a><nav><a href="/characters/">Characters</a><a href="/works/">Works</a><a href="/songs/">Songs</a></nav></header><main class="container"><article id="character"><p>読み込み中...</p></article></main><script>
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f||row.length){row.push(f);rows.push(row)}const h=rows.shift().map(x=>x.trim());return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((x,i)=>[x,(r[i]??'').trim()])))}
async function get(f){const r=await fetch('/kagamito/pages/'+f);if(!r.ok)throw Error(f+' の読み込みに失敗しました');return parseCSV(await r.text())}
function sec(t,c){return c?`<section class="character-section"><h2>${t}</h2>${c}</section>`:''}
async function main(){const path=location.pathname.split('/');if(path.length<3||path[1]!=='characters')return document.getElementById('character').innerHTML='<h1>Page not found</h1>';const id=decodeURIComponent(path.pop().replace(/\.html$/,''));const [cs,ss,ws]=await Promise.all([get('characters.csv'),get('songs.csv'),get('works.csv')]);const c=cs.find(x=>x['URL ID']===id);if(!c)throw Error('キャラクターが見つかりません');document.title=(c['日本語名']||id)+' - Kagamito Official';let h=`<header class="character-header">${c['二つ名']?`<p>${c['二つ名']}</p>`:''}<h1>${c['日本語名']||''}</h1>${c['読み']?`<p class="character-reading">${c['読み']}</p>`:''}${c['English Name']?`<p class="character-english">${c['English Name']}</p>`:''}</header>`;if(c['容姿画像パス'])h+=`<img class="character-image" src="${c['容姿画像パス']}" alt="${c['日本語名']||''}">`;h+=sec('能力',c['能力']?`<p>${c['能力']}</p>${c['能力詳細']?`<p>${c['能力詳細']}</p>`:''}`:'');h+=sec('立場',c['立場']?`<p>${c['立場']}</p>`:'');const song=ss.find(x=>x['Music ID']===c['テーマ曲ID']);h+=sec('テーマ曲',song?`<p>${song['日本語曲名']}</p>`:'');const debut=ws.find(x=>x['Work ID']===c['初登場作品ID']);h+=sec('初登場作品',debut?`<p>${debut['日本語タイトル']}</p>`:'');const ids=(c['登場作品ID']||'').split(/\s*,\s*/).filter(Boolean);const list=ids.map(x=>{const w=ws.find(y=>y['Work ID']===x);return `<li>${w?w['日本語タイトル']:x}</li>`}).join('');h+=sec('登場作品',list?`<ul class="related-list">${list}</ul>`:'');h+=sec('プロフィール',c['プロフィール']?`<p>${c['プロフィール']}</p>`:'');document.getElementById('character').innerHTML=h}main().catch(e=>document.getElementById('character').innerHTML=`<p>${e.message}</p>`);
</script></body></html>
